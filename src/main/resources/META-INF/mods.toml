[[mods]]
modId="integratedindustrialcraft"
version="${file.jarVersion}"
displayName="Integrated Industrial Craft"
logoFile="icon.png"
authors="MineRealms Team"
description='''
Integrated Industrial Craft (IIC) - A comprehensive integration mod for ImprovedMobs, GregTech CEu, and Spore.

Features:
- Tri-Axis Difficulty System (Time, Voltage, Pollution)
- Dynamic pollution system with environmental effects
- Industrial threat system (mob attacks on machines)
- Spore integration with infection mechanics
- Mekanism laser turrets for base defense
- Real-time HUD display system
- Terrain scanner tool
'''

[[mixins]]
config="integratedindustrialcraft.mixins.json"

[[dependencies.integratedindustrialcraft]]
modId="forge"
mandatory=true
versionRange="[47,)"
ordering="NONE"
side="BOTH"

[[dependencies.integratedindustrialcraft]]
modId="minecraft"
mandatory=true
versionRange="[1.20.1,1.21)"
ordering="NONE"
side="BOTH"

[[dependencies.integratedindustrialcraft]]
modId="gtceu"
mandatory=false
versionRange="[7.2.0,)"
ordering="AFTER"
side="BOTH"

[[dependencies.integratedindustrialcraft]]
modId="spore"
mandatory=false
versionRange="[2.0,)"
ordering="AFTER"
side="BOTH"

[[dependencies.integratedindustrialcraft]]
modId="mekanism"
mandatory=false
versionRange="[10.4.16,)"
ordering="AFTER"
side="BOTH"

[[dependencies.integratedindustrialcraft]]
modId="geckolib"
mandatory=true
versionRange="[4.8,)"
ordering="BEFORE"
side="BOTH"

# ==================== AssimpLoader Mod ====================

[[mods]]
modId="assimploader"
version="${file.jarVersion}"
displayName="AssimpLoader - Advanced 3D Model System"
logoFile="assimploader_icon.png"
authors="MineRealms Team"
description='''
AssimpLoader - Advanced 3D Model Loading System for Minecraft

A powerful bridge between Assimp (Open Asset Import Library) and Minecraft's rendering pipeline.

Features:
- Support for 40+ 3D model formats (FBX, GLTF, Collada, OBJ, Blender, 3DS, etc.)
- Skeletal animation system with bone hierarchies
- PBR material support
- Efficient model caching and async loading
- Modern rendering pipeline integration
- Resource pack support

Supported Formats:
FBX, GLTF/GLB, Collada (DAE), OBJ, Blender (.blend), 3DS, STL, PLY,
MD2, MD3, MD5, MDL, ASE, LWO, DXF, and many more!
'''

[[dependencies.assimploader]]
modId="forge"
mandatory=true
versionRange="[47,)"
ordering="NONE"
side="BOTH"

[[dependencies.assimploader]]
modId="minecraft"
mandatory=true
versionRange="[1.20.1,1.21)"
ordering="NONE"
side="BOTH"
