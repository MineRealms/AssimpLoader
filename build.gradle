buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '6.0.54'
        classpath 'org.spongepowered:mixingradle:0.7.38'
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'org.spongepowered.mixin'
apply plugin: 'java-library'

version = mod_version
group = maven_group
base { archivesName = archives_base_name }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// Content mods compile against the library; the library never sees their classes.
sourceSets {
    showcase {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    integrationTest {
        java.srcDirs = ['src/integration/java']
        resources.srcDirs = ['src/integration/resources']
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath + sourceSets.showcase.output
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath + sourceSets.showcase.output
    }
}
configurations {
    localRuntime { canBeConsumed = false; canBeResolved = false }
    runtimeClasspath.extendsFrom localRuntime
    showcaseImplementation.extendsFrom implementation
    showcaseCompileOnly.extendsFrom compileOnly
    showcaseRuntimeOnly.extendsFrom runtimeOnly
    showcaseAnnotationProcessor.extendsFrom annotationProcessor
    integrationTestImplementation.extendsFrom showcaseImplementation
    integrationTestCompileOnly.extendsFrom showcaseCompileOnly
    integrationTestRuntimeOnly.extendsFrom showcaseRuntimeOnly
}
evaluationDependsOn(':rigworks')

minecraft {
    mappings channel: 'official', version: '1.20.1'

    runs {
        client {
            workingDirectory project.file(project.findProperty('clientGameDir') ?: 'run')
            if (project.hasProperty('clientUsername')) args '--username', project.property('clientUsername').toString()
            if (project.hasProperty('clientServer')) args '--quickPlayMultiplayer', project.property('clientServer').toString()
            if (project.hasProperty('clientCharacterSyncRole')) {
                property 'charactersynctest.role', project.property('clientCharacterSyncRole').toString()
                property 'charactersynctest.world', (project.findProperty('clientCharacterSyncWorld') ?: 'Character_Config_Sync_Acceptance').toString()
                property 'charactersynctest.port', (project.findProperty('clientCharacterSyncPort') ?: '25575').toString()
                property 'charactersynctest.coordination', project.file(project.findProperty('clientCharacterSyncCoordination') ?: 'build/character-sync-coordination').absolutePath
                args '--width', '1280', '--height', '900'
            }
            if (project.hasProperty('clientWorkbenchSmoke')) {
                property 'workbenchtest.enabled', 'true'
                if (project.hasProperty('clientCharacterSyncRole')) property 'workbenchtest.afterSync', 'true'
                property 'workbenchtest.world', project.property('clientWorkbenchSmoke').toString()
                if (project.hasProperty('clientWorkbenchAsset')) property 'workbenchtest.asset', project.file(project.property('clientWorkbenchAsset')).absolutePath
                if (!project.hasProperty('clientCharacterSyncRole')) args '--width', '1280', '--height', '900'
            }
            if (project.hasProperty('clientWorld')) {
                args '--quickPlaySingleplayer', project.property('clientWorld').toString()
            }
            if (project.hasProperty('clientVanillaCompatibilitySmoke')) {
                property 'vanillaCompatibilityTest.enabled', 'true'
                property 'vanillaCompatibilityTest.world', project.property('clientVanillaCompatibilitySmoke').toString()
                args '--width', '1280', '--height', '900'
            }
            if (project.hasProperty('clientCharacterClipSmoke')) {
                property 'charactercliptest.enabled', 'true'
                property 'charactercliptest.world', project.property('clientCharacterClipSmoke').toString()
                if (project.hasProperty('clientCharacterGpuSmoke')) property 'charactercliptest.requireOculusGpu', 'true'
                args '--width', '1280', '--height', '900'
            }
            if (project.hasProperty('clientEquipmentWorkbenchSmoke')) {
                property 'equipmentworkbenchtest.enabled', 'true'
                if (!project.hasProperty('clientCharacterClipSmoke')) args '--width', '1280', '--height', '900'
            }
            if (project.hasProperty('clientLookDevSmoke')) {
                property 'lookdevtest.enabled', 'true'
                property 'lookdevtest.world', project.property('clientLookDevSmoke').toString()
                if (project.hasProperty('clientVanillaPoseOnly')) property 'lookdevtest.poseOnly', 'true'
                args '--width', '1280', '--height', '720'
            }
            if(project.hasProperty('clientCharacterSmoke')) {
                if(['clientBatchSmoke','clientRuntimeSmoke','clientComputeSmoke','clientHighBoneSmoke','clientDeerSmoke','clientAnimationSmoke','clientSmokeWorld','clientStartupSmoke','clientPbrSmoke','clientAssetSmoke','clientVehicleSmoke','clientRocketSmoke','clientKubeJsSmoke'].any { project.hasProperty(it) })
                    throw new GradleException('clientCharacterSmoke must run independently')
                property 'charactertest.enabled','true'
                property 'charactertest.world',project.property('clientCharacterSmoke').toString()
                args '--width','1280','--height','900'
            }
            if (project.hasProperty('clientBatchSmoke')) {
                if (['clientRuntimeSmoke','clientComputeSmoke','clientHighBoneSmoke','clientDeerSmoke','clientAnimationSmoke','clientSmokeWorld','clientStartupSmoke','clientPbrSmoke','clientAssetSmoke','clientVehicleSmoke','clientRocketSmoke','clientKubeJsSmoke'].any { project.hasProperty(it) }) {
                    throw new GradleException('clientBatchSmoke must run independently')
                }
                property 'batchtest.enabled','true'
                if(project.hasProperty('clientBatchSafety')) property 'batchtest.safety','true'
                args '--width','1280','--height','900'
            }
            if (project.hasProperty('clientKubeJsWorldSmoke')) {
                if (!project.hasProperty('clientRuntimeSmoke')) throw new GradleException('clientKubeJsWorldSmoke requires clientRuntimeSmoke=<world>')
                property 'worldruntimetest.kubejs','true'
            }
            if (project.hasProperty('clientKubeJsSmoke')) {
                if (['clientRuntimeSmoke','clientComputeSmoke','clientHighBoneSmoke','clientDeerSmoke','clientAnimationSmoke','clientSmokeWorld','clientStartupSmoke','clientPbrSmoke','clientAssetSmoke','clientVehicleSmoke','clientRocketSmoke'].any { project.hasProperty(it) }) {
                    throw new GradleException('clientKubeJsSmoke must run independently')
                }
                property 'assimp.kubejsSmoke','true'
            }
            if (project.hasProperty('clientJfr')) {
                jvmArgs '-XX:StartFlightRecording=filename=' + project.file('build/reports/assimp-client.jfr').absolutePath + ',settings=profile,dumponexit=true'
            }
            if (project.hasProperty('clientHighBoneSmoke') || project.hasProperty('clientComputeSmoke')) {
                if (['clientRuntimeSmoke','clientDeerSmoke','clientAnimationSmoke','clientSmokeWorld','clientStartupSmoke','clientPbrSmoke','clientAssetSmoke','clientVehicleSmoke','clientRocketSmoke'].any { project.hasProperty(it) }) {
                    throw new GradleException('clientHighBoneSmoke must run independently')
                }
                property 'highbonetest.enabled','true'
                if (project.hasProperty('clientComputeSmoke')) property 'highbonetest.compute','true'
                args '--width','1280','--height','900'
            }
            if (project.hasProperty('clientRuntimeSmoke')) {
                if (['clientDeerSmoke','clientHighBoneSmoke','clientComputeSmoke','clientAnimationSmoke','clientSmokeWorld','clientStartupSmoke','clientPbrSmoke','clientAssetSmoke','clientVehicleSmoke','clientRocketSmoke'].any { project.hasProperty(it) }) {
                    throw new GradleException('clientRuntimeSmoke must run independently')
                }
                property 'worldruntimetest.enabled','true'
                if (project.hasProperty('withOculus')) property 'worldruntimetest.shaders','true'
                property 'worldruntimetest.world',project.property('clientRuntimeSmoke').toString()
                if(project.hasProperty('clientRuntimeBatchSmoke')) property 'worldruntimetest.batches','true'
                args '--width','1280','--height','900'
            }
            if (project.hasProperty('clientDeerSmoke')) {
                if (['clientAnimationSmoke', 'clientSmokeWorld', 'clientStartupSmoke', 'clientPbrSmoke', 'clientAssetSmoke', 'clientVehicleSmoke', 'clientRocketSmoke'].any { project.hasProperty(it) }) {
                    throw new GradleException('clientDeerSmoke must run independently of the other client smoke tests')
                }
                property 'deertest.enabled', 'true'
                property 'deertest.world', project.property('clientDeerSmoke').toString()
                args '--width', '1280', '--height', '900'
            }
            if (project.hasProperty('clientAnimationSmoke')) {
                if (['clientSmokeWorld', 'clientStartupSmoke', 'clientPbrSmoke', 'clientAssetSmoke', 'clientVehicleSmoke', 'clientRocketSmoke'].any { project.hasProperty(it) }) {
                    throw new GradleException('clientAnimationSmoke must run independently of the other client smoke tests')
                }
                property 'animationtest.enabled', 'true'
                args '--width', '1280', '--height', '900'
            }
            if (project.hasProperty('clientRocketSmoke')) {
                if (['clientSmokeWorld', 'clientStartupSmoke', 'clientPbrSmoke', 'clientAssetSmoke', 'clientVehicleSmoke'].any { project.hasProperty(it) }) {
                    throw new GradleException('clientRocketSmoke must run independently of the other client smoke tests')
                }
                property 'rockettest.enabled', 'true'
                property 'rockettest.world', project.property('clientRocketSmoke').toString()
                args '--width', '1280', '--height', '720'
            }
            if (project.hasProperty('clientSmokeWorld')) {
                property 'autotest.enabled', 'true'
                property 'autotest.capture', 'true'
                property 'autotest.world', project.property('clientSmokeWorld').toString()
            }
            if (project.hasProperty('clientStartupSmoke')) {
                property 'autotest.enabled', 'true'
                property 'autotest.startupOnly', 'true'
            }
            if (project.hasProperty('clientPbrSmoke')) {
                property 'autotest.enabled', 'true'
                property 'autotest.pbr', 'true'
                property 'autotest.world', project.property('clientPbrSmoke').toString()
                property 'autotest.pbrKeepOpen', project.hasProperty('clientPbrKeepOpen').toString()
                args '--width', '1280', '--height', '720'
            }
            if (project.hasProperty('clientAssetSmoke')) {
                if (['clientSmokeWorld', 'clientStartupSmoke', 'clientPbrSmoke'].any { project.hasProperty(it) }) {
                    throw new GradleException('clientAssetSmoke must run independently of the other client smoke tests')
                }
                property 'assettest.enabled', 'true'
                property 'assettest.world', project.property('clientAssetSmoke').toString()
                property 'assettest.model', project.findProperty('clientAssetModel') ?: 'PROBE_TEXTURED'
                args '--width', '1280', '--height', '720'
            }
            if (project.hasProperty('clientVehicleSmoke')) {
                if (['clientSmokeWorld', 'clientStartupSmoke', 'clientPbrSmoke', 'clientAssetSmoke'].any { project.hasProperty(it) }) {
                    throw new GradleException('clientVehicleSmoke must run independently of the other client smoke tests')
                }
                property 'vehicletest.enabled', 'true'
                property 'vehicletest.world', project.property('clientVehicleSmoke').toString()
                args '--width', '1280', '--height', '720'
            }
            if (project.hasProperty('rosettaRepo')) {
                property 'rosetta.remote.bind', '127.0.0.1'
                property 'rosetta.remote.port', project.findProperty('rosettaPort') ?: '48790'
            }
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', 'assimploader'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            mods {
                assimploader {
                    source sourceSets.main
                    source sourceSets.integrationTest
                }
                assimpshowcase {
                    source sourceSets.showcase
                }
                rigworks {
                    source project(':rigworks').sourceSets.main
                    source project(':rigworks').sourceSets.integration
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', 'assimploader'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            mods {
                assimploader {
                    source sourceSets.main
                }
                assimpshowcase { source sourceSets.showcase }
                rigworks { source project(':rigworks').sourceSets.main }
            }
        }

        data {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            args '--all', '--mod', 'assimploader', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')

            mods {
                assimploader {
                    source sourceSets.main
                }
            }
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

if (project.hasProperty('clientLookDevSmoke')) {
    def resultFile = file('run/lookdev-smoke-result.json')
    tasks.matching { it.name == 'runClient' }.configureEach {
        doFirst {
            if (resultFile.exists() && !resultFile.delete()) throw new GradleException('Cannot remove stale LookDev result')
        }
        doLast {
            if (!resultFile.isFile()) throw new GradleException('LookDev acceptance did not produce a result')
            def result = new groovy.json.JsonSlurper().parse(resultFile)
            if (result.success != true) throw new GradleException("LookDev acceptance failed at ${result.stage}: ${result.failure}")
            logger.lifecycle("LookDev acceptance ${result.run}: ${result.stages} stages passed")
        }
    }
}

if (project.hasProperty('clientCharacterSmoke')) {
    def resultFile = file('run/character-smoke-result.json')
    tasks.matching { it.name == 'runClient' }.configureEach {
        doFirst {
            if (resultFile.exists() && !resultFile.delete())
                throw new GradleException('Cannot remove stale character acceptance result')
        }
        doLast {
            if (!resultFile.isFile()) throw new GradleException('Character acceptance did not produce a result')
            def result = new groovy.json.JsonSlurper().parse(resultFile)
            if (result.success != true) throw new GradleException("Character acceptance failed at stage ${result.stage}: ${result.failure}")
            logger.lifecycle("Character acceptance ${result.run}: ${result.stages} stages passed")
        }
    }
}

if (project.hasProperty('clientKubeJsSmoke') || project.hasProperty('clientKubeJsWorldSmoke')) {
    def serverSmoke = project.hasProperty('clientKubeJsWorldSmoke')
    def smokeSource = file(serverSmoke ? 'model-tests/kubejs/assimploader_server_acceptance.js' : 'model-tests/kubejs/assimploader_acceptance.js')
    def smokeTarget = file(serverSmoke ? 'run/kubejs/server_scripts/assimploader_acceptance.generated.js' : 'run/kubejs/client_scripts/assimploader_acceptance.generated.js')
    def smokePayload = {
        serverSmoke ? smokeSource.bytes : (file('rigworks/examples/kubejs/client_scripts/rigworks_player_actions.js').getText('UTF-8') + '\n' + smokeSource.getText('UTF-8')).getBytes('UTF-8')
    }
    def prepareScript = tasks.register('prepareKubeJsSmoke') {
        doLast {
            byte[] payload = smokePayload()
            if (smokeTarget.exists() && !Arrays.equals(smokeTarget.bytes, payload)) {
                throw new GradleException('Refusing to replace an existing KubeJS acceptance script')
            }
            smokeTarget.parentFile.mkdirs()
            smokeTarget.bytes = payload
        }
    }
    def cleanScript = tasks.register('cleanKubeJsSmoke') {
        doLast {
            if (smokeTarget.isFile() && Arrays.equals(smokeTarget.bytes, smokePayload())) smokeTarget.delete()
        }
    }
    tasks.matching { it.name == 'runClient' }.configureEach { dependsOn prepareScript; finalizedBy cleanScript }
}

if (project.hasProperty('clientKubeJsSmoke')) {
    def kubeResult = file('run/kubejs-smoke-result.json')
    tasks.matching { it.name == 'runClient' }.configureEach {
        doFirst {
            if (kubeResult.exists() && !kubeResult.delete()) throw new GradleException('Cannot remove stale KubeJS result')
        }
        doLast {
            if (!kubeResult.isFile()) throw new GradleException('KubeJS acceptance did not produce a result')
            def result = new groovy.json.JsonSlurper().parse(kubeResult)
            if (result.success != true) throw new GradleException("KubeJS acceptance failed: ${result.failure}")
        }
    }
}

configurations {
    // Resolve native packaging separately from the mapped Forge runtimeClasspath, which is
    // not available while the task graph is being built on a cold cache.
    assimpNatives {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
}

// Plain libraries and native resources must also be visible to the game's class loader.
fg.configureMinecraftLibraryConfiguration(configurations.assimpNatives)

repositories {
    if (project.hasProperty('f3TweakerJar')) {
        flatDir { dirs file(project.property('f3TweakerJar')).parentFile }
    }
    exclusiveContent {
        forRepository { mavenCentral() }
        filter {
            includeGroup 'com.github.stephengold'
            includeGroup 'javax.vecmath'
        }
    }
    maven { url = 'https://maven.minecraftforge.net/' }
    mavenCentral()
    maven {
        url = 'https://maven.latvian.dev/releases'
        content { includeGroup 'dev.latvian.mods' }
    }
    maven {
        url = 'https://maven.architectury.dev/'
        content { includeGroup 'dev.architectury' }
    }
    // ModernUI
    maven { url = 'https://maven.izzel.io/releases/' }
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    if (project.hasProperty('rosettaRepo')) {
        maven {
            url = uri(project.property('rosettaRepo'))
            content { includeGroup 'dev.rosetta' }
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:1.20.1-${forge_version}"

    // Bullet rigid bodies/constraints, isolated behind the character physics service.
    for (physicsLibrary in [
            [group: 'com.github.stephengold', name: 'jbullet', version: '1.0.3', range: '[1.0.3,1.0.4)'],
            [group: 'com.github.stephengold', name: 'stack-alloc', version: '1.0.2', range: '[1.0.2,1.0.3)'],
            [group: 'javax.vecmath', name: 'vecmath', version: '1.5.2', range: '[1.5.2,1.5.3)']]) {
        api("${physicsLibrary.group}:${physicsLibrary.name}:${physicsLibrary.version}") { transitive = false }
        minecraftLibrary("${physicsLibrary.group}:${physicsLibrary.name}:${physicsLibrary.version}") { transitive = false }
        jarJar(group: physicsLibrary.group, name: physicsLibrary.name, version: physicsLibrary.range) {
            transitive = false
            // Resolve a fixed binary while retaining a compatible Jar-in-Jar selection interval.
            jarJar.pin(it, physicsLibrary.version)
        }
    }

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    for (coordinate in ['dev.latvian.mods:kubejs-forge:2001.6.5-build.26',
                        'dev.latvian.mods:rhino-forge:2001.2.2-build.17',
                        'dev.architectury:architectury-forge:9.1.12']) {
        def kubeDependency = fg.deobf(coordinate)
        compileOnly(kubeDependency) { transitive = false }
        if (project.hasProperty('withKubeJS') || project.hasProperty('clientKubeJsSmoke') || project.hasProperty('clientKubeJsWorldSmoke')) {
            localRuntime(kubeDependency) { transitive = false }
        }
    }

    // LWJGL Assimp bindings - MUST match Minecraft's LWJGL version (3.3.1)
    implementation(platform("org.lwjgl:lwjgl-bom:3.3.1"))
    minecraftLibrary("org.lwjgl:lwjgl-assimp:3.3.1") {
        transitive = false // Minecraft already supplies the matching LWJGL core.
    }
    api('org.lwjgl:lwjgl-assimp:3.3.1') { transitive = false }

    // Bundle LWJGL Assimp into the mod
    jarJar(group: 'org.lwjgl', name: 'lwjgl-assimp', version: '[3.3.1,3.3.2)')

    // Natives are packaged into the '-all' jar by the `jarJar` task below; they must never be
    // on the compile classpath and must never leak into other mods' classpath.
    // runtimeOnly keeps them available to the dev runs; assimpNatives is what gets bundled.
    for (nativesClassifier in ['windows', 'linux', 'macos', 'windows-arm64', 'linux-arm64', 'macos-arm64']) {
        runtimeOnly "org.lwjgl:lwjgl-assimp:3.3.1:natives-${nativesClassifier}"
        assimpNatives "org.lwjgl:lwjgl-assimp:3.3.1:natives-${nativesClassifier}"
    }

    // Dormant historical editor sources compile for reference; active LookDev is independent.
    compileOnly "icyllis.modernui:ModernUI-Core:${modernui_core_version}@jar"
    testRuntimeOnly "icyllis.modernui:ModernUI-Core:${modernui_core_version}@jar"
    localRuntime fg.deobf("icyllis.modernui:ModernUI-Forge:${modernui_forge_version}")
    for (module in ['ModernUI-Core', 'ModernUI-Markdown']) {
        minecraftLibrary("icyllis.modernui:${module}:${modernui_core_version}") {
            exclude group: 'org.slf4j', module: 'slf4j-api'
            exclude group: 'org.apache.logging.log4j'
            exclude group: 'com.google.code.findbugs', module: 'jsr305'
            exclude group: 'org.jetbrains', module: 'annotations'
            exclude group: 'com.ibm.icu', module: 'icu4j'
            exclude group: 'it.unimi.dsi', module: 'fastutil'
        }
    }
    if (project.hasProperty('f3TweakerJar')) {
        def devJar = file(project.property('f3TweakerJar'))
        if (!devJar.isFile()) throw new GradleException("F3Tweaker JAR does not exist: ${devJar}")
        localRuntime fg.deobf("local.dev:${devJar.name.replaceFirst(/\.jar$/, '')}:local")
    }

    // Fixed Modrinth version IDs resolve before compilation on a fresh checkout.
    // Optional mods are available in dev runs but never bundled by jarJar.
    def softDeps = [
            'maven.modrinth:gzevkJbM:a7chTVuf', // Photon 1.1.17
            'maven.modrinth:B1CBVXHX:yhlCY3k1' // LDLib 1.0.48
    ]
    softDeps.each { dep ->
        def mapped = fg.deobf(dep)
        compileOnly mapped
        if (!project.hasProperty('withoutOptionalMods')) localRuntime mapped
    }

    // Development clients include Oculus by default; never bundled into the mod.
    if (!project.hasProperty('withoutOculus')) {
        localRuntime fg.deobf('maven.modrinth:oculus:iQ1SwGc3') // Oculus 1.8.0 / MC 1.20.1
        localRuntime fg.deobf('maven.modrinth:embeddium:UTbfe5d1') // Embeddium 0.3.31
    }
    if (project.hasProperty('rosettaRepo')) {
        // A Maven coordinate lets ForgeGradle remap the bridge for a development client.
        localRuntime(fg.deobf("dev.rosetta:rosetta-remote-debug-bridge-forge:${project.findProperty('rosettaVersion') ?: '1.0.0'}")) {
            transitive = false
        }
    }

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.9.3'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.9.3'
}

jar {
    exclude 'assimpshowcase.refmap.json'
    from(['LICENSE', 'docs/THIRD_PARTY_NOTICES.md']) { into 'META-INF' }
    from('licenses') { into 'META-INF/licenses' }
    from('third_party_sources') { into 'META-INF/third-party-sources' }
    manifest {
        attributes([
                "Specification-Title"     : "assimploader",
                "Specification-Vendor"    : "MineRealms Team",
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.version.toString(),
                "Implementation-Vendor"   : "MineRealms Team",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                "MixinConfigs"            : "mixins.photon_compat.json,mixins.iris_compat.json,mixins.assimploader.json"
        ])
    }

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

jarJar.enable()

// The '-all' jar is what users install, so the Assimp natives have to live there.
// (Putting them in the plain jar only would ship a mod that cannot load its native library.)
tasks.named('jarJar').configure {
    exclude 'assimpshowcase.refmap.json'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(['LICENSE', 'docs/THIRD_PARTY_NOTICES.md']) { into 'META-INF' }
    from('licenses') { into 'META-INF/licenses' }
    from('third_party_sources') { into 'META-INF/third-party-sources' }

    from {
        project.configurations.assimpNatives.collect {
            zipTree(it).matching {
                exclude 'META-INF/**'
                exclude '**/*.git'
                exclude '**/*.sha1'
            }
        }
    }
}

mixin {
    add sourceSets.main, "assimploader.refmap.json"
    config "mixins.photon_compat.json"
    config "mixins.iris_compat.json"
    config "mixins.assimploader.json"
    add sourceSets.showcase, 'assimpshowcase.refmap.json'
    config 'mixins.assimpshowcase.json'
    config 'mixins.rigworks.json'
    config 'mixins.rigworks.kubejs.json'
}

tasks.register('showcaseJar', Jar) {
    exclude 'assimploader.refmap.json'
    archiveBaseName = 'assimpshowcase'
    from sourceSets.showcase.output
    from('LICENSE') { into 'META-INF' }
    manifest { attributes 'MixinConfigs': 'mixins.assimpshowcase.json' }
}
reobf { showcaseJar {} }
tasks.named('showcaseJar').configure { finalizedBy 'reobfShowcaseJar' }

// Only the development acceptance harness may depend on both content mods.
sourceSets.integrationTest.compileClasspath += project(':rigworks').sourceSets.main.output + project(':rigworks').sourceSets.integration.output
sourceSets.integrationTest.runtimeClasspath += project(':rigworks').sourceSets.main.output + project(':rigworks').sourceSets.integration.output
sourceSets.test.compileClasspath += sourceSets.showcase.output
sourceSets.test.runtimeClasspath += sourceSets.showcase.output
tasks.named('build').configure { dependsOn 'showcaseJar', ':rigworks:build' }
apply from: 'gradle/module-boundaries.gradle'
// ForgeGradle 6 resolves source-set build task names in the run's owning project.
tasks.register('integrationClasses') { dependsOn ':rigworks:integrationClasses' }
tasks.matching { it.name in ['runClient', 'prepareRunClient', 'runServer', 'prepareRunServer'] }.configureEach {
    dependsOn ':rigworks:classes'
}

jar.finalizedBy('reobfJar')

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

tasks.withType(Test) {
    useJUnitPlatform()
    if (project.hasProperty('runtimeBenchmark')) {
        systemProperty 'assimp.runtimeBenchmark', 'true'
    }
}

// ==================== Deployment ====================

/**
 * Copy the built jar into a game's mods folder.
 * The destination is machine-local: pass -PgameModsDir=... instead of hardcoding it.
 */
tasks.register('copyToGameMods', Copy) {
    description = 'Copy built JAR to a game mods directory (requires -PgameModsDir=...)'
    group = 'deployment'

    def dest = project.findProperty('gameModsDir')
    onlyIf { dest != null }

    from("${buildDir}/libs") {
        include '*-all.jar'
        rename '(.*)-all.jar', '$1.jar'
    }
    if (dest != null) {
        into dest
    }

    dependsOn 'reobfJarJar'

    doLast {
        println "Copied jar to ${dest}"
    }
}


// ==================== Optional dev-only dependencies ====================

/**
 * Photon and LDLib are needed to compile the optional Photon editor integration, but they
 * are not redistributable, so they are downloaded on demand instead of being committed.
 *
 * Pinned by Modrinth version id (not version number) so the artefacts can never silently
 * change underneath us, and verified by sha512.
 */
def devOnlyDeps = [
        [
                name  : 'photon-forge-1.20.1-1.1.17.jar',
                url   : 'https://cdn.modrinth.com/data/gzevkJbM/versions/a7chTVuf/photon-forge-1.20.1-1.1.17.jar',
                sha512: 'b0bdc63d73f9eda4a38c16e2cedbf80e325f57ba4452fbab8959a8bbc9f3a99754298d8b45376aee69e87ad91508c63ad045d76233b304a6a1de9cbeaf02c8f6'
        ],
        [
                name  : 'ldlib-forge-1.20.1-1.0.48.jar',
                url   : 'https://cdn.modrinth.com/data/B1CBVXHX/versions/yhlCY3k1/ldlib-forge-1.20.1-1.0.48.jar',
                sha512: '564f71dccc84854e84fc795d7c2972b785498de198bafdae22e46e7b6fd257e6b4cd0b24396eae7caaec16f090500069f06e6b43ad50130a9d50ee9923850c59'
        ]
]

tasks.register('downloadDevDeps') {
    group = 'deployment'
    description = 'Downloads the non-redistributable dev-only mod jars into mods_dev/'

    def targetDir = layout.projectDirectory.dir('mods_dev').asFile
    outputs.dir(targetDir)

    doLast {
        def sha512 = { File file ->
            def digest = java.security.MessageDigest.getInstance('SHA-512')
            file.withInputStream { input ->
                byte[] buffer = new byte[64 * 1024]
                int read
                while ((read = input.read(buffer)) != -1) {
                    digest.update(buffer, 0, read)
                }
            }
            digest.digest().collect { String.format('%02x', it) }.join()
        }

        targetDir.mkdirs()

        devOnlyDeps.each { dep ->
            def target = new File(targetDir, dep.name)

            if (target.isFile() && sha512(target) == dep.sha512) {
                logger.lifecycle("Already present: ${dep.name}")
                return
            }

            logger.lifecycle("Downloading ${dep.name} ...")
            def connection = new URL(dep.url).openConnection()
            connection.setRequestProperty('User-Agent', 'assimploader-build')
            connection.connectTimeout = 30_000
            connection.readTimeout = 120_000

            def temp = new File(targetDir, dep.name + '.part')
            connection.inputStream.withStream { input ->
                temp.withOutputStream { output -> output << input }
            }

            def actual = sha512(temp)
            if (actual != dep.sha512) {
                temp.delete()
                throw new GradleException("Checksum mismatch for ${dep.name}: expected ${dep.sha512}, got ${actual}")
            }

            if (target.exists() && !target.delete()) {
                throw new GradleException("Could not replace ${target}")
            }
            if (!temp.renameTo(target)) {
                throw new GradleException("Could not move ${temp} to ${target}")
            }
            logger.lifecycle("Downloaded ${dep.name}")
        }
    }
}
