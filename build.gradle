buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://maven.aliyun.com/repository/public' }
        maven { url = 'https://repo.spongepowered.org/maven' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '6.0.+', changing: true
        classpath 'org.spongepowered:mixingradle:0.7.+'
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'org.spongepowered.mixin'

version = mod_version
group = maven_group
archivesBaseName = archives_base_name

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'

    // accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', 'assimploader'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            lazyToken('minecraft_classpath') {
                configurations.library.copyRecursive().resolve().collect { it.absolutePath }.join(File.pathSeparator)
            }

            mods {
                assimploader {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', 'assimploader'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            lazyToken('minecraft_classpath') {
                configurations.library.copyRecursive().resolve().collect { it.absolutePath }.join(File.pathSeparator)
            }

            mods {
                assimploader {
                    source sourceSets.main
                }
            }
        }

        data {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            args '--all', '--mod', 'assimploader', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')

            lazyToken('minecraft_classpath') {
                configurations.library.copyRecursive().resolve().collect { it.absolutePath }.join(File.pathSeparator)
            }

            mods {
                assimploader {
                    source sourceSets.main
                }
            }
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
    library
    implementation.extendsFrom library
}

repositories {
    mavenLocal()
    maven { url = "https://maven.gtceu.com" }
    maven { url = "https://maven.blamejared.com/" }
    maven { url = "https://maven.virtuoel.com" }
    maven { url "https://maven.blazing-coop.net/releases"}
    maven { url = "https://jitpack.io" }
    maven { url = "https://maven.saps.dev/releases" }
    maven { url = "https://maven.blazing-coop.net/releases" }
    maven { url = "https://www.cursemaven.com" }
    maven { url = "https://maven.firstdarkdev.xyz/snapshots" }
    maven { url = "https://maven.tterrag.com/" }
    maven { url = "https://modmaven.dev" }
    maven { url = 'https://maven.parchmentmc.org' }
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    maven { url 'https://modmaven.dev/' }
    maven { url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
    maven { url 'https://www.cursemaven.com' }
    maven { url "https://maven.firstdarkdev.xyz/snapshots"  }

    // ModernUI-MC
    maven {
        name 'IzzelAliz Maven'
        url 'https://maven.izzel.io/releases/'
    }

    // Photon and LDLib (from Photon's build.gradle)
    maven {
        name 'Latvian Maven'
        url 'https://maven.latvian.dev/releases'
    }
    maven {
        name 'JitPack'
        url 'https://jitpack.io/'
    }

    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:1.20.1-${forge_version}"

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // LWJGL Assimp bindings - MUST match Minecraft's LWJGL version (3.3.1)
    implementation(platform("org.lwjgl:lwjgl-bom:3.3.1"))
    implementation "org.lwjgl:lwjgl-assimp:3.3.1"

    // Use jarJar to bundle LWJGL Assimp into the mod
    jarJar(group: 'org.lwjgl', name: 'lwjgl-assimp', version: '[3.3.1,3.3.2)')

    // Natives for development and runtime
    def nativesClassifier = "natives-windows"
    if (org.gradle.internal.os.OperatingSystem.current().isLinux()) {
        nativesClassifier = "natives-linux"
    } else if (org.gradle.internal.os.OperatingSystem.current().isMacOsX()) {
        nativesClassifier = "natives-macos"
    }

    runtimeOnly "org.lwjgl:lwjgl-assimp:3.3.1:${nativesClassifier}"

    // Also include natives in the JAR for distribution
    implementation "org.lwjgl:lwjgl-assimp:3.3.1:natives-windows"
    implementation "org.lwjgl:lwjgl-assimp:3.3.1:natives-linux"
    implementation "org.lwjgl:lwjgl-assimp:3.3.1:natives-macos"

    // ImprovedMobs - Required dependency (temporarily disabled due to network issues)
    // implementation fg.deobf("io.github.flemmli97:improvedmobs:${improvedmobs_version}-forge")
    // implementation fg.deobf("io.github.flemmli97:tenshilib:${tenshilib_version}-forge")

    // ModernUI-MC (from local files)
    implementation fg.deobf(fileTree(dir: 'mods_dev', include: '*.jar'))

    // Photon Integration (Optional - compileOnly for conditional loading)
    compileOnly fg.deobf(fileTree(dir: 'mods_dev', include: '*.jar'))

    // glsl-transformer (AGPLv3 许可证) - Optional for Iris/Oculus shader injection
    compileOnly 'io.github.douira:glsl-transformer:2.0.0-pre13'

    // ANTLR4 运行时 (required by glsl-transformer)
    compileOnly 'org.antlr:antlr4-runtime:4.13.1'
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : "assimploader",
                "Specification-Vendor"    : "minerealms",
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : "minerealms",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    // Set duplicate handling strategy
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    // Include LWJGL Assimp natives in the JAR
    from {
        configurations.runtimeClasspath.findAll {
            it.name.contains('lwjgl-assimp') && it.name.contains('natives')
        }.collect {
            zipTree(it).matching {
                exclude 'META-INF/**'  // Exclude META-INF to avoid duplicates
            }
        }
    }
}

// Enable jarJar to bundle LWJGL Assimp
jarJar.enable()

// Configure jarJar task to also include natives
tasks.named('jarJar').configure {
    // Set duplicate handling strategy
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    // Include LWJGL Assimp natives in the jarJar output
    from {
        project.configurations.runtimeClasspath.findAll {
            it.name.contains('lwjgl-assimp') && it.name.contains('natives')
        }.collect {
            zipTree(it).matching {
                exclude 'META-INF/**'  // Exclude META-INF to avoid duplicates
            }
        }
    }
}

mixin {
    add sourceSets.main, "assimploader.refmap.json"
    config "mixins.photon_compat.json"
    config "mixins.iris_compat.json"
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : "assimploader",
                "Specification-Vendor"    : "MineRealms Team",
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : "MineRealms Team",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                "MixinConfigs"            : "mixins.photon_compat.json,mixins.iris_compat.json"
        ])
    }
}

jar.finalizedBy('reobfJar')

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

// ==================== 自动部署和启动游戏 ====================

/**
 * 复制构建的 JAR 到游戏 mods 目录
 */
task copyToGameMods(type: Copy) {
    description = 'Copy built JAR to game mods directory'
    group = 'deployment'

    // Copy the jarJar output (-all.jar now includes both jarJar deps and natives)
    from("${buildDir}/libs") {
        include '*-all.jar'
        rename '(.*)-all.jar', '$1.jar'
    }
    into 'G:\\MinecraftGames\\CTNH-BaopuEdition\\.minecraft\\versions\\Create New Horizon\\mods'

    // 确保在 reobfJarJar 完成后执行
    dependsOn 'reobfJarJar'

    doLast {
        println "✓ JAR 已复制到游戏 mods 目录: ${destinationDir}"
    }
}
