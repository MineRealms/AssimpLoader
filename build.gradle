buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '6.0.54'
        classpath 'org.spongepowered:mixingradle:0.7.38'
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'org.spongepowered.mixin'

version = mod_version
group = maven_group
base { archivesName = archives_base_name }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', 'assimploader'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            lazyToken('minecraft_classpath') {
                configurations.library.copyRecursive().resolve().collect { it.absolutePath }.join(File.pathSeparator)
            }

            mods {
                assimploader {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', 'assimploader'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            lazyToken('minecraft_classpath') {
                configurations.library.copyRecursive().resolve().collect { it.absolutePath }.join(File.pathSeparator)
            }

            mods {
                assimploader {
                    source sourceSets.main
                }
            }
        }

        data {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            args '--all', '--mod', 'assimploader', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')

            lazyToken('minecraft_classpath') {
                configurations.library.copyRecursive().resolve().collect { it.absolutePath }.join(File.pathSeparator)
            }

            mods {
                assimploader {
                    source sourceSets.main
                }
            }
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
    library
    implementation.extendsFrom library
}

repositories {
    maven { url = 'https://maven.minecraftforge.net/' }
    mavenCentral()
    // ModernUI
    maven { url = 'https://maven.izzel.io/releases/' }
    // glsl-transformer (optional Iris/Oculus shader injection)
    maven { url = 'https://jitpack.io' }
}

dependencies {
    minecraft "net.minecraftforge:forge:1.20.1-${forge_version}"

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // LWJGL Assimp bindings - MUST match Minecraft's LWJGL version (3.3.1)
    implementation(platform("org.lwjgl:lwjgl-bom:3.3.1"))
    implementation "org.lwjgl:lwjgl-assimp:3.3.1"

    // Bundle LWJGL Assimp into the mod
    jarJar(group: 'org.lwjgl', name: 'lwjgl-assimp', version: '[3.3.1,3.3.2)')

    // Natives are packaged into the jar by the `jar` task below; they must never be on the
    // compile classpath and must never leak into other mods' classpath.
    runtimeOnly "org.lwjgl:lwjgl-assimp:3.3.1:natives-windows"
    runtimeOnly "org.lwjgl:lwjgl-assimp:3.3.1:natives-linux"
    runtimeOnly "org.lwjgl:lwjgl-assimp:3.3.1:natives-macos"

    // Optional soft dependencies, taken from the local `mods_dev` folder (not distributed).
    // Only the jars we actually compile against are picked up.
    def softDeps = fileTree(dir: 'mods_dev', include: [
            'ModernUI-*.jar',
            'photon-*.jar',
            'ldlib-*.jar'
    ])
    if (!softDeps.isEmpty()) {
        compileOnly softDeps
        runtimeOnly softDeps
    } else {
        logger.warn("mods_dev/ is missing ModernUI/Photon/LDLib jars - the LookDev UI and Photon " +
                "compatibility layer will not compile. See README (Development environment).")
    }

    // glsl-transformer (AGPLv3) - optional, only used when Iris/Oculus is present
    compileOnly 'io.github.douira:glsl-transformer:2.0.0-pre13'
    compileOnly 'org.antlr:antlr4-runtime:4.13.1'

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.9.3'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.9.3'
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : "assimploader",
                "Specification-Vendor"    : "MineRealms Team",
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : "MineRealms Team",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                "MixinConfigs"            : "mixins.photon_compat.json,mixins.iris_compat.json"
        ])
    }

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    // Ship the Assimp natives for every platform inside the mod jar
    from {
        configurations.runtimeClasspath.findAll {
            it.name.contains('lwjgl-assimp') && it.name.contains('natives')
        }.collect {
            zipTree(it).matching {
                exclude 'META-INF/**'
            }
        }
    }
}

jarJar.enable()

tasks.named('jarJar').configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

mixin {
    add sourceSets.main, "assimploader.refmap.json"
    config "mixins.photon_compat.json"
    config "mixins.iris_compat.json"
}

jar.finalizedBy('reobfJar')

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

tasks.withType(Test) {
    useJUnitPlatform()
}

// ==================== Deployment ====================

/**
 * Copy the built jar into a game's mods folder.
 * The destination is machine-local: pass -PgameModsDir=... instead of hardcoding it.
 */
tasks.register('copyToGameMods', Copy) {
    description = 'Copy built JAR to a game mods directory (requires -PgameModsDir=...)'
    group = 'deployment'

    def dest = project.findProperty('gameModsDir')
    onlyIf { dest != null }

    from("${buildDir}/libs") {
        include '*-all.jar'
        rename '(.*)-all.jar', '$1.jar'
    }
    if (dest != null) {
        into dest
    }

    dependsOn 'reobfJarJar'

    doLast {
        println "Copied jar to ${dest}"
    }
}
