plugins {
    id 'eclipse'
    id 'idea'
    id 'dev.kikugie.stonecutter'
    // Both loader plugin families come from ModDevGradle. They are declared here (apply false)
    // so that the per-node branch below can apply exactly one of them.
    id 'net.neoforged.moddev.legacyforge' version '2.0.148' apply false
    id 'net.neoforged.moddev' version '2.0.148' apply false
}

// This file is Stonecutter's shared build script: it runs once per node.
def isForge = mod_loader == 'forge'

version = mod_version
group = maven_group
base { archivesName = "${mod_id}-${minecraft_version}" }
java.toolchain.languageVersion = JavaLanguageVersion.of(java_version.toInteger())

// Run directories live at the repository root. The 1.20.1 node keeps the historical `run/`
// layout; the 1.21.1 node gets a `-1.21.1` suffix so the two never share configs, saves or logs.
def runSuffix = isForge ? '' : '-1.21.1'
def runClientDir = rootProject.file("run${runSuffix}")
def runServerDir = rootProject.file("run-server${runSuffix}")
def runDataDir = rootProject.file("run-data${runSuffix}")

// Values expanded into the loader metadata of either node. The loader-version ranges only
// exist in their own node's gradle.properties, so they are added conditionally.
def metadata = [
        minecraft_version_range: minecraft_version_range,
        loader_version_range  : loader_version_range,
        kubejs_version_range  : kubejs_version_range,
        pack_format           : pack_format,
        mod_id                : mod_id,
        mod_name              : mod_name,
        mod_license           : mod_license,
        mod_version           : mod_version,
        mod_authors           : mod_authors,
        mod_description       : mod_description,
]
if (project.hasProperty('forge_version_range')) metadata.forge_version_range = project.property('forge_version_range')
if (project.hasProperty('neo_version_range')) metadata.neo_version_range = project.property('neo_version_range')

// ------------------------------------------------------------------ source sets
// `showcase` is a separate content mod; `integrationTest` holds the client smoke tests and is
// merged into the engine mod in dev runs. Both are isolated from `main` by construction.
sourceSets {
    showcase {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    integrationTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath + sourceSets.showcase.output
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath + sourceSets.showcase.output
    }
}

configurations {
    // Resolve native packaging separately from the mapped runtime classpath, which is not
    // available while the task graph is being built on a cold cache.
    assimpNatives {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    showcaseImplementation.extendsFrom implementation
    showcaseCompileOnly.extendsFrom compileOnly
    showcaseRuntimeOnly.extendsFrom runtimeOnly
    showcaseAnnotationProcessor.extendsFrom annotationProcessor
    integrationTestImplementation.extendsFrom showcaseImplementation
    integrationTestCompileOnly.extendsFrom showcaseCompileOnly
    integrationTestRuntimeOnly.extendsFrom showcaseRuntimeOnly
}

// Generated resources are written by the `data` run. The directory lives at the repository
// root; a relative path would resolve into the Stonecutter node directory.
sourceSets.main.resources { srcDir rootProject.file('src/generated/resources') }

if (isForge) {
    // ---------------------------------------------------------------- 1.20.1 / Forge (LegacyForge)
    apply plugin: 'net.neoforged.moddev.legacyforge'

    legacyForge {
        // ModDevGradle picks its "without recompilation" artifact pipeline whenever CI=true.
        // That pipeline keeps Forge's own signed manifest in the produced jar, so the patched
        // classes fail the SHA-256 digest check as soon as a test loads one of them
        // (SecurityException: SHA-256 digest error for net/minecraftforge/...). The recompiled
        // artifact carries no signature, so pin the behaviour instead of inheriting the
        // environment's CI variable. `enable` replaces the modding settings, so the version has
        // to be repeated inside the same block.
        enable {
            forgeVersion = "${minecraft_version}-${forge_version}"
            disableRecompilation = false
        }

        runs {
            configureEach {
                gameDirectory = rootProject.file('run')
                systemProperty 'forge.logging.markers', 'REGISTRIES'
                systemProperty 'forge.logging.console.level', 'debug'
                // LegacyForge sets `mixin.env.remapRefMap` and `mixin.env.refMapRemappingFile`
                // itself (pointing at its own `moddev/artifacts/intermediateToNamed.srg`), so the
                // single-version build's hand-written values must NOT be repeated here.
            }
            client {
                client()
                gameDirectory = rootProject.file(project.findProperty('clientGameDir') ?: "run${runSuffix}")
                if (project.hasProperty('clientUsername')) {
                    programArgument '--username'
                    programArgument project.property('clientUsername').toString()
                }
                if (project.hasProperty('clientServer')) {
                    programArgument '--quickPlayMultiplayer'
                    programArgument project.property('clientServer').toString()
                }
                if (project.hasProperty('clientWorkbenchSmoke')) {
                    systemProperty 'workbenchtest.enabled', 'true'
                    systemProperty 'workbenchtest.world', project.property('clientWorkbenchSmoke').toString()
                    if (project.hasProperty('clientWorkbenchAsset')) {
                        systemProperty 'workbenchtest.asset', rootProject.file(project.property('clientWorkbenchAsset')).absolutePath
                    }
                    programArgument '--width'
                    programArgument '1280'
                    programArgument '--height'
                    programArgument '900'
                }
                if (project.hasProperty('clientWorld')) {
                    programArgument '--quickPlaySingleplayer'
                    programArgument project.property('clientWorld').toString()
                }
                if (project.hasProperty('clientBatchSmoke')) {
                    if (['clientRuntimeSmoke', 'clientComputeSmoke', 'clientHighBoneSmoke', 'clientDeerSmoke',
                         'clientAnimationSmoke', 'clientSmokeWorld', 'clientStartupSmoke', 'clientPbrSmoke',
                         'clientAssetSmoke', 'clientVehicleSmoke', 'clientRocketSmoke', 'clientKubeJsSmoke'].any {
                        project.hasProperty(it)
                    }) {
                        throw new GradleException('clientBatchSmoke must run independently')
                    }
                    systemProperty 'batchtest.enabled', 'true'
                    if (project.hasProperty('clientBatchSafety')) systemProperty 'batchtest.safety', 'true'
                    programArgument '--width'
                    programArgument '1280'
                    programArgument '--height'
                    programArgument '900'
                }
                if (project.hasProperty('clientKubeJsWorldSmoke')) {
                    if (!project.hasProperty('clientRuntimeSmoke')) {
                        throw new GradleException('clientKubeJsWorldSmoke requires clientRuntimeSmoke=<world>')
                    }
                    systemProperty 'worldruntimetest.kubejs', 'true'
                }
                if (project.hasProperty('clientKubeJsSmoke')) {
                    if (['clientRuntimeSmoke', 'clientComputeSmoke', 'clientHighBoneSmoke', 'clientDeerSmoke',
                         'clientAnimationSmoke', 'clientSmokeWorld', 'clientStartupSmoke', 'clientPbrSmoke',
                         'clientAssetSmoke', 'clientVehicleSmoke', 'clientRocketSmoke'].any { project.hasProperty(it) }) {
                        throw new GradleException('clientKubeJsSmoke must run independently')
                    }
                    systemProperty 'assimp.kubejsSmoke', 'true'
                }
                if (project.hasProperty('clientJfr')) {
                    jvmArgument '-XX:StartFlightRecording=filename=' +
                            layout.buildDirectory.file('reports/assimp-client.jfr').get().asFile.absolutePath +
                            ',settings=profile,dumponexit=true'
                }
                if (project.hasProperty('clientHighBoneSmoke') || project.hasProperty('clientComputeSmoke')) {
                    if (['clientRuntimeSmoke', 'clientDeerSmoke', 'clientAnimationSmoke', 'clientSmokeWorld',
                         'clientStartupSmoke', 'clientPbrSmoke', 'clientAssetSmoke', 'clientVehicleSmoke',
                         'clientRocketSmoke'].any { project.hasProperty(it) }) {
                        throw new GradleException('clientHighBoneSmoke must run independently')
                    }
                    systemProperty 'highbonetest.enabled', 'true'
                    if (project.hasProperty('clientComputeSmoke')) systemProperty 'highbonetest.compute', 'true'
                    programArgument '--width'
                    programArgument '1280'
                    programArgument '--height'
                    programArgument '900'
                }
                if (project.hasProperty('clientRuntimeSmoke')) {
                    if (['clientDeerSmoke', 'clientHighBoneSmoke', 'clientComputeSmoke', 'clientAnimationSmoke',
                         'clientSmokeWorld', 'clientStartupSmoke', 'clientPbrSmoke', 'clientAssetSmoke',
                         'clientVehicleSmoke', 'clientRocketSmoke'].any { project.hasProperty(it) }) {
                        throw new GradleException('clientRuntimeSmoke must run independently')
                    }
                    systemProperty 'worldruntimetest.enabled', 'true'
                    if (project.hasProperty('withOculus')) systemProperty 'worldruntimetest.shaders', 'true'
                    systemProperty 'worldruntimetest.world', project.property('clientRuntimeSmoke').toString()
                    if (project.hasProperty('clientRuntimeBatchSmoke')) {
                        systemProperty 'worldruntimetest.batches', 'true'
                    }
                    programArgument '--width'
                    programArgument '1280'
                    programArgument '--height'
                    programArgument '900'
                }
                if (project.hasProperty('clientDeerSmoke')) {
                    if (['clientAnimationSmoke', 'clientSmokeWorld', 'clientStartupSmoke', 'clientPbrSmoke',
                         'clientAssetSmoke', 'clientVehicleSmoke', 'clientRocketSmoke'].any { project.hasProperty(it) }) {
                        throw new GradleException('clientDeerSmoke must run independently of the other client smoke tests')
                    }
                    systemProperty 'deertest.enabled', 'true'
                    systemProperty 'deertest.world', project.property('clientDeerSmoke').toString()
                    programArgument '--width'
                    programArgument '1280'
                    programArgument '--height'
                    programArgument '900'
                }
                if (project.hasProperty('clientAnimationSmoke')) {
                    if (['clientSmokeWorld', 'clientStartupSmoke', 'clientPbrSmoke', 'clientAssetSmoke',
                         'clientVehicleSmoke', 'clientRocketSmoke'].any { project.hasProperty(it) }) {
                        throw new GradleException('clientAnimationSmoke must run independently of the other client smoke tests')
                    }
                    systemProperty 'animationtest.enabled', 'true'
                    programArgument '--width'
                    programArgument '1280'
                    programArgument '--height'
                    programArgument '900'
                }
                if (project.hasProperty('clientRocketSmoke')) {
                    if (['clientSmokeWorld', 'clientStartupSmoke', 'clientPbrSmoke', 'clientAssetSmoke',
                         'clientVehicleSmoke'].any { project.hasProperty(it) }) {
                        throw new GradleException('clientRocketSmoke must run independently of the other client smoke tests')
                    }
                    systemProperty 'rockettest.enabled', 'true'
                    systemProperty 'rockettest.world', project.property('clientRocketSmoke').toString()
                    programArgument '--width'
                    programArgument '1280'
                    programArgument '--height'
                    programArgument '720'
                }
                if (project.hasProperty('clientSmokeWorld')) {
                    systemProperty 'autotest.enabled', 'true'
                    systemProperty 'autotest.capture', 'true'
                    systemProperty 'autotest.world', project.property('clientSmokeWorld').toString()
                }
                if (project.hasProperty('clientStartupSmoke')) {
                    systemProperty 'autotest.enabled', 'true'
                    systemProperty 'autotest.startupOnly', 'true'
                }
                if (project.hasProperty('clientPbrSmoke')) {
                    systemProperty 'autotest.enabled', 'true'
                    systemProperty 'autotest.pbr', 'true'
                    systemProperty 'autotest.world', project.property('clientPbrSmoke').toString()
                    systemProperty 'autotest.pbrKeepOpen', project.hasProperty('clientPbrKeepOpen').toString()
                    programArgument '--width'
                    programArgument '1280'
                    programArgument '--height'
                    programArgument '720'
                }
                if (project.hasProperty('clientAssetSmoke')) {
                    if (['clientSmokeWorld', 'clientStartupSmoke', 'clientPbrSmoke'].any { project.hasProperty(it) }) {
                        throw new GradleException('clientAssetSmoke must run independently of the other client smoke tests')
                    }
                    systemProperty 'assettest.enabled', 'true'
                    systemProperty 'assettest.world', project.property('clientAssetSmoke').toString()
                    systemProperty 'assettest.model', project.findProperty('clientAssetModel') ?: 'PROBE_TEXTURED'
                    programArgument '--width'
                    programArgument '1280'
                    programArgument '--height'
                    programArgument '720'
                }
                if (project.hasProperty('clientVehicleSmoke')) {
                    if (['clientSmokeWorld', 'clientStartupSmoke', 'clientPbrSmoke', 'clientAssetSmoke'].any {
                        project.hasProperty(it)
                    }) {
                        throw new GradleException('clientVehicleSmoke must run independently of the other client smoke tests')
                    }
                    systemProperty 'vehicletest.enabled', 'true'
                    systemProperty 'vehicletest.world', project.property('clientVehicleSmoke').toString()
                    programArgument '--width'
                    programArgument '1280'
                    programArgument '--height'
                    programArgument '720'
                }
                if (project.hasProperty('rosettaRepo')) {
                    systemProperty 'rosetta.remote.bind', '127.0.0.1'
                    systemProperty 'rosetta.remote.port', project.findProperty('rosettaPort') ?: '48790'
                }
                systemProperty 'forge.enabledGameTestNamespaces', mod_id
            }

            server {
                server()
                gameDirectory = runServerDir
                programArgument '--nogui'
                systemProperty 'forge.enabledGameTestNamespaces', mod_id
            }

            data {
                data()
                gameDirectory = runDataDir
                programArgument '--all'
                programArgument '--mod'
                programArgument mod_id
                programArgument '--output'
                programArgument rootProject.file('src/generated/resources/').absolutePath
                programArgument '--existing'
                programArgument rootProject.file('src/main/resources/').absolutePath
            }
        }

        mods {
            assimploader {
                sourceSet sourceSets.main
                sourceSet sourceSets.integrationTest
            }
            assimpshowcase {
                sourceSet sourceSets.showcase
            }
        }

        // Isolated source sets do not inherit the modding classpath; give each one explicitly.
        addModdingDependenciesTo sourceSets.test
        addModdingDependenciesTo sourceSets.showcase
        addModdingDependenciesTo sourceSets.integrationTest
    }

    repositories {
        maven {
            url = 'https://maven.minecraftforge.net/'
        }
        mavenCentral()
        maven {
            url = 'https://maven.latvian.dev/releases'
            content { includeGroup 'dev.latvian.mods' }
        }
        maven {
            url = 'https://maven.architectury.dev/'
            content { includeGroup 'dev.architectury' }
        }
        maven {
            url = 'https://api.modrinth.com/maven'
            content { includeGroup 'maven.modrinth' }
        }
        exclusiveContent {
            forRepository { mavenCentral() }
            filter {
                includeGroup 'com.github.stephengold'
                includeGroup 'javax.vecmath'
            }
        }
        if (project.hasProperty('rosettaRepo')) {
            maven {
                url = uri(project.property('rosettaRepo'))
                content { includeGroup 'dev.rosetta' }
            }
        }
        if (project.hasProperty('f3TweakerJar')) {
            flatDir { dirs rootProject.file(project.property('f3TweakerJar')).parentFile }
        }
    }

    dependencies {
        // The Mixin annotation processor writes the refmap and its `.mappings.tsrg` file, which
        // `reobfJar` consumes. Without it on the processor path neither file is produced.
        annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

        // Bullet rigid bodies/constraints, isolated behind the character physics service.
        for (physicsLibrary in [
                [group: 'com.github.stephengold', name: 'jbullet', version: jbullet_version, range: "[${jbullet_version},1.0.4)"],
                [group: 'com.github.stephengold', name: 'stack-alloc', version: stack_alloc_version, range: "[${stack_alloc_version},1.0.3)"],
                [group: 'javax.vecmath', name: 'vecmath', version: vecmath_version, range: "[${vecmath_version},1.5.3)"]]) {
            jarJar(api("${physicsLibrary.group}:${physicsLibrary.name}:${physicsLibrary.version}") { transitive = false }) {
                version {
                    strictly physicsLibrary.range
                    prefer physicsLibrary.version
                }
            }
            // Plain libraries are invisible to the game classloader in 1.20.1 runs unless they are
            // also added to the additional runtime classpath (the ForgeGradle `minecraftLibrary`).
            additionalRuntimeClasspath("${physicsLibrary.group}:${physicsLibrary.name}:${physicsLibrary.version}") {
                transitive = false
            }
        }

        // LWJGL Assimp bindings - MUST match Minecraft's LWJGL version.
        implementation platform("org.lwjgl:lwjgl-bom:${lwjgl_version}")
        jarJar(api("org.lwjgl:lwjgl-assimp:${lwjgl_version}") { transitive = false }) {
            version {
                strictly lwjgl_version_range
                prefer lwjgl_version
            }
        }
        additionalRuntimeClasspath("org.lwjgl:lwjgl-assimp:${lwjgl_version}") { transitive = false }

        // Natives are packaged into the release jar below; they must never be on the compile
        // classpath and must never leak into other mods' classpath.
        for (nativesClassifier in ['windows', 'linux', 'macos', 'windows-arm64', 'linux-arm64', 'macos-arm64']) {
            runtimeOnly "org.lwjgl:lwjgl-assimp:${lwjgl_version}:natives-${nativesClassifier}"
            assimpNatives "org.lwjgl:lwjgl-assimp:${lwjgl_version}:natives-${nativesClassifier}"
            // NeoForge's dev bootstrap builds the game classloader from `legacyClassPath.file`,
            // not from the JVM `-cp`, so the natives need to be on the additional runtime
            // classpath too: `Assimp`'s static initializer resolves
            // `<platform>/<arch>/org/lwjgl/assimp/*.dll` through its own classloader.
            additionalRuntimeClasspath("org.lwjgl:lwjgl-assimp:${lwjgl_version}:natives-${nativesClassifier}") {
                transitive = false
            }
        }

        // KubeJS / Rhino / Architectury: compile-only by default, installed only for the
        // KubeJS acceptance runs.
        modCompileOnly("dev.latvian.mods:kubejs-forge:${kubejs_version}") { transitive = false }
        modCompileOnly("dev.latvian.mods:rhino-forge:${rhino_version}") { transitive = false }
        modCompileOnly("dev.architectury:architectury-forge:${architectury_version}") { transitive = false }
        if (project.hasProperty('withKubeJS') || project.hasProperty('clientKubeJsSmoke') ||
                project.hasProperty('clientKubeJsWorldSmoke')) {
            modRuntimeOnly("dev.latvian.mods:kubejs-forge:${kubejs_version}") { transitive = false }
            modRuntimeOnly("dev.latvian.mods:rhino-forge:${rhino_version}") { transitive = false }
            modRuntimeOnly("dev.architectury:architectury-forge:${architectury_version}") { transitive = false }
        }

        if (project.hasProperty('f3TweakerJar')) {
            def devJar = rootProject.file(project.property('f3TweakerJar'))
            if (!devJar.isFile()) throw new GradleException("F3Tweaker JAR does not exist: ${devJar}")
            modRuntimeOnly("local.dev:${devJar.name.replaceFirst(/\.jar$/, '')}:local")
        }

        // Fixed Modrinth version IDs resolve before compilation on a fresh checkout.
        // Optional mods are available in dev runs but never bundled by jarJar.
        modCompileOnly("maven.modrinth:gzevkJbM:${photon_version}") { transitive = false }
        modCompileOnly("maven.modrinth:B1CBVXHX:${ldlib_version}") { transitive = false }
        if (!project.hasProperty('withoutOptionalMods')) {
            modRuntimeOnly("maven.modrinth:gzevkJbM:${photon_version}") { transitive = false }
            modRuntimeOnly("maven.modrinth:B1CBVXHX:${ldlib_version}") { transitive = false }
        }

        // Development clients include Oculus by default; never bundled into the mod.
        if (!project.hasProperty('withoutOculus')) {
            modRuntimeOnly("maven.modrinth:oculus:${oculus_version}") { transitive = false }
            modRuntimeOnly("maven.modrinth:embeddium:${embeddium_version}") { transitive = false }
        }
        if (project.hasProperty('rosettaRepo')) {
            modRuntimeOnly("dev.rosetta:rosetta-remote-debug-bridge-forge:${project.findProperty('rosettaVersion') ?: '1.0.0'}") {
                transitive = false
            }
        }

        // Minecraft/Forge supply JNA at runtime; compile-only keeps it out of the jar.
        compileOnly "net.java.dev.jna:jna:${jna_version}"
        testImplementation "net.java.dev.jna:jna:${jna_version}"

        testImplementation platform("org.junit:junit-bom:${junit_version}")
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    // Forge 1.20.1 has no `[[mixins]]` support in mods.toml; the only registration point is the
    // `MixinConfigs` manifest attribute. MDG's mixin extension also generates the refmaps.
    mixin {
        add sourceSets.main, 'assimploader.refmap.json'
        config 'mixins.photon_compat.json'
        config 'mixins.iris_compat.json'
        config 'mixins.assimploader.json'
        add sourceSets.showcase, 'assimpshowcase.refmap.json'
        config 'mixins.assimpshowcase.json'
    }

    // `mixin { add(...) }` collects every refmap's TSRG mappings into one project-wide file
    // collection that ALL reobfuscation tasks consume - including the main `reobfJar`, which does
    // not package the showcase. It therefore has to wait for the showcase compile to have written
    // `assimpshowcase.refmap.json.mappings.tsrg`, or it dies with FileNotFoundException.
    tasks.named('reobfJar') { dependsOn tasks.named('compileShowcaseJava') }

    tasks.named('processResources', ProcessResources).configure {
        inputs.properties metadata
        filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) { expand metadata }
    }
    tasks.named('processShowcaseResources', ProcessResources).configure {
        inputs.properties metadata
        filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) { expand metadata }
    }

    tasks.named('jar', Jar).configure {
        archiveClassifier = mod_loader
        manifest {
            attributes('Specification-Title': mod_name, 'Specification-Vendor': mod_authors,
                    'Specification-Version': '1',
                    'Implementation-Title': "${rootProject.name}-${sc.current.version}",
                    'Implementation-Version': project.version, 'Implementation-Vendor': mod_authors,
                    'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                    'MixinConfigs': 'mixins.photon_compat.json,mixins.iris_compat.json,mixins.assimploader.json')
        }
        from([rootProject.file('LICENSE'), rootProject.file('docs/THIRD_PARTY_NOTICES.md')]) { into 'META-INF' }
        from(rootProject.file('licenses')) { into 'META-INF/licenses' }
        from(rootProject.file('third_party_sources')) { into 'META-INF/third-party-sources' }
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        // The Assimp natives have to live in the distributable jar; LWJGL's SharedLibraryLoader
        // reads them from the classpath at `<platform>/<arch>/org/lwjgl/assimp/...`.
        from({
            project.configurations.assimpNatives.collect {
                zipTree(it).matching {
                    exclude 'META-INF/**'
                    exclude '**/*.git'
                    exclude '**/*.sha1'
                }
            }
        })
    }
} else {
    // ---------------------------------------------------------------- 1.21.1 / NeoForge
    apply plugin: 'net.neoforged.moddev'

    neoForge {
        version = neo_version

        parchment {
            minecraftVersion = minecraft_version
            mappingsVersion = parchment_mappings
        }

        runs {
            configureEach {
                gameDirectory = rootProject.file('run')
                systemProperty 'forge.logging.markers', 'REGISTRIES'
                systemProperty 'forge.logging.console.level', 'debug'
            }
            client {
                client()
                gameDirectory = rootProject.file(project.findProperty('clientGameDir') ?: "run${runSuffix}")
                if (project.hasProperty('clientUsername')) {
                    programArgument '--username'
                    programArgument project.property('clientUsername').toString()
                }
                if (project.hasProperty('clientServer')) {
                    programArgument '--quickPlayMultiplayer'
                    programArgument project.property('clientServer').toString()
                }
                if (project.hasProperty('clientWorkbenchSmoke')) {
                    systemProperty 'workbenchtest.enabled', 'true'
                    systemProperty 'workbenchtest.world', project.property('clientWorkbenchSmoke').toString()
                    if (project.hasProperty('clientWorkbenchAsset')) {
                        systemProperty 'workbenchtest.asset', rootProject.file(project.property('clientWorkbenchAsset')).absolutePath
                    }
                    programArgument '--width'
                    programArgument '1280'
                    programArgument '--height'
                    programArgument '900'
                }
                if (project.hasProperty('clientWorld')) {
                    programArgument '--quickPlaySingleplayer'
                    programArgument project.property('clientWorld').toString()
                }
                if (project.hasProperty('clientBatchSmoke')) {
                    if (['clientRuntimeSmoke', 'clientComputeSmoke', 'clientHighBoneSmoke', 'clientDeerSmoke',
                         'clientAnimationSmoke', 'clientSmokeWorld', 'clientStartupSmoke', 'clientPbrSmoke',
                         'clientAssetSmoke', 'clientVehicleSmoke', 'clientRocketSmoke', 'clientKubeJsSmoke'].any {
                        project.hasProperty(it)
                    }) {
                        throw new GradleException('clientBatchSmoke must run independently')
                    }
                    systemProperty 'batchtest.enabled', 'true'
                    if (project.hasProperty('clientBatchSafety')) systemProperty 'batchtest.safety', 'true'
                    programArgument '--width'
                    programArgument '1280'
                    programArgument '--height'
                    programArgument '900'
                }
                if (project.hasProperty('clientKubeJsWorldSmoke')) {
                    if (!project.hasProperty('clientRuntimeSmoke')) {
                        throw new GradleException('clientKubeJsWorldSmoke requires clientRuntimeSmoke=<world>')
                    }
                    systemProperty 'worldruntimetest.kubejs', 'true'
                }
                if (project.hasProperty('clientKubeJsSmoke')) {
                    if (['clientRuntimeSmoke', 'clientComputeSmoke', 'clientHighBoneSmoke', 'clientDeerSmoke',
                         'clientAnimationSmoke', 'clientSmokeWorld', 'clientStartupSmoke', 'clientPbrSmoke',
                         'clientAssetSmoke', 'clientVehicleSmoke', 'clientRocketSmoke'].any { project.hasProperty(it) }) {
                        throw new GradleException('clientKubeJsSmoke must run independently')
                    }
                    systemProperty 'assimp.kubejsSmoke', 'true'
                }
                if (project.hasProperty('clientJfr')) {
                    jvmArgument '-XX:StartFlightRecording=filename=' +
                            layout.buildDirectory.file('reports/assimp-client.jfr').get().asFile.absolutePath +
                            ',settings=profile,dumponexit=true'
                }
                if (project.hasProperty('clientHighBoneSmoke') || project.hasProperty('clientComputeSmoke')) {
                    if (['clientRuntimeSmoke', 'clientDeerSmoke', 'clientAnimationSmoke', 'clientSmokeWorld',
                         'clientStartupSmoke', 'clientPbrSmoke', 'clientAssetSmoke', 'clientVehicleSmoke',
                         'clientRocketSmoke'].any { project.hasProperty(it) }) {
                        throw new GradleException('clientHighBoneSmoke must run independently')
                    }
                    systemProperty 'highbonetest.enabled', 'true'
                    if (project.hasProperty('clientComputeSmoke')) systemProperty 'highbonetest.compute', 'true'
                    programArgument '--width'
                    programArgument '1280'
                    programArgument '--height'
                    programArgument '900'
                }
                if (project.hasProperty('clientRuntimeSmoke')) {
                    if (['clientDeerSmoke', 'clientHighBoneSmoke', 'clientComputeSmoke', 'clientAnimationSmoke',
                         'clientSmokeWorld', 'clientStartupSmoke', 'clientPbrSmoke', 'clientAssetSmoke',
                         'clientVehicleSmoke', 'clientRocketSmoke'].any { project.hasProperty(it) }) {
                        throw new GradleException('clientRuntimeSmoke must run independently')
                    }
                    systemProperty 'worldruntimetest.enabled', 'true'
                    if (project.hasProperty('withOculus')) systemProperty 'worldruntimetest.shaders', 'true'
                    systemProperty 'worldruntimetest.world', project.property('clientRuntimeSmoke').toString()
                    if (project.hasProperty('clientRuntimeBatchSmoke')) {
                        systemProperty 'worldruntimetest.batches', 'true'
                    }
                    programArgument '--width'
                    programArgument '1280'
                    programArgument '--height'
                    programArgument '900'
                }
                if (project.hasProperty('clientDeerSmoke')) {
                    if (['clientAnimationSmoke', 'clientSmokeWorld', 'clientStartupSmoke', 'clientPbrSmoke',
                         'clientAssetSmoke', 'clientVehicleSmoke', 'clientRocketSmoke'].any { project.hasProperty(it) }) {
                        throw new GradleException('clientDeerSmoke must run independently of the other client smoke tests')
                    }
                    systemProperty 'deertest.enabled', 'true'
                    systemProperty 'deertest.world', project.property('clientDeerSmoke').toString()
                    programArgument '--width'
                    programArgument '1280'
                    programArgument '--height'
                    programArgument '900'
                }
                if (project.hasProperty('clientAnimationSmoke')) {
                    if (['clientSmokeWorld', 'clientStartupSmoke', 'clientPbrSmoke', 'clientAssetSmoke',
                         'clientVehicleSmoke', 'clientRocketSmoke'].any { project.hasProperty(it) }) {
                        throw new GradleException('clientAnimationSmoke must run independently of the other client smoke tests')
                    }
                    systemProperty 'animationtest.enabled', 'true'
                    programArgument '--width'
                    programArgument '1280'
                    programArgument '--height'
                    programArgument '900'
                }
                if (project.hasProperty('clientRocketSmoke')) {
                    if (['clientSmokeWorld', 'clientStartupSmoke', 'clientPbrSmoke', 'clientAssetSmoke',
                         'clientVehicleSmoke'].any { project.hasProperty(it) }) {
                        throw new GradleException('clientRocketSmoke must run independently of the other client smoke tests')
                    }
                    systemProperty 'rockettest.enabled', 'true'
                    systemProperty 'rockettest.world', project.property('clientRocketSmoke').toString()
                    programArgument '--width'
                    programArgument '1280'
                    programArgument '--height'
                    programArgument '720'
                }
                if (project.hasProperty('clientSmokeWorld')) {
                    systemProperty 'autotest.enabled', 'true'
                    systemProperty 'autotest.capture', 'true'
                    systemProperty 'autotest.world', project.property('clientSmokeWorld').toString()
                }
                if (project.hasProperty('clientStartupSmoke')) {
                    systemProperty 'autotest.enabled', 'true'
                    systemProperty 'autotest.startupOnly', 'true'
                }
                if (project.hasProperty('clientPbrSmoke')) {
                    systemProperty 'autotest.enabled', 'true'
                    systemProperty 'autotest.pbr', 'true'
                    systemProperty 'autotest.world', project.property('clientPbrSmoke').toString()
                    systemProperty 'autotest.pbrKeepOpen', project.hasProperty('clientPbrKeepOpen').toString()
                    programArgument '--width'
                    programArgument '1280'
                    programArgument '--height'
                    programArgument '720'
                }
                if (project.hasProperty('clientAssetSmoke')) {
                    if (['clientSmokeWorld', 'clientStartupSmoke', 'clientPbrSmoke'].any { project.hasProperty(it) }) {
                        throw new GradleException('clientAssetSmoke must run independently of the other client smoke tests')
                    }
                    systemProperty 'assettest.enabled', 'true'
                    systemProperty 'assettest.world', project.property('clientAssetSmoke').toString()
                    systemProperty 'assettest.model', project.findProperty('clientAssetModel') ?: 'PROBE_TEXTURED'
                    programArgument '--width'
                    programArgument '1280'
                    programArgument '--height'
                    programArgument '720'
                }
                if (project.hasProperty('clientVehicleSmoke')) {
                    if (['clientSmokeWorld', 'clientStartupSmoke', 'clientPbrSmoke', 'clientAssetSmoke'].any {
                        project.hasProperty(it)
                    }) {
                        throw new GradleException('clientVehicleSmoke must run independently of the other client smoke tests')
                    }
                    systemProperty 'vehicletest.enabled', 'true'
                    systemProperty 'vehicletest.world', project.property('clientVehicleSmoke').toString()
                    programArgument '--width'
                    programArgument '1280'
                    programArgument '--height'
                    programArgument '720'
                }
                if (project.hasProperty('rosettaRepo')) {
                    systemProperty 'rosetta.remote.bind', '127.0.0.1'
                    systemProperty 'rosetta.remote.port', project.findProperty('rosettaPort') ?: '48790'
                }
                systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            }

            server {
                server()
                gameDirectory = runServerDir
                programArgument '--nogui'
                systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            }

            data {
                data()
                gameDirectory = runDataDir
                programArgument '--all'
                programArgument '--mod'
                programArgument mod_id
                programArgument '--output'
                programArgument rootProject.file('src/generated/resources/').absolutePath
                programArgument '--existing'
                programArgument rootProject.file('src/main/resources/').absolutePath
            }
        }

        mods {
            assimploader {
                sourceSet sourceSets.main
                sourceSet sourceSets.integrationTest
            }
            assimpshowcase {
                sourceSet sourceSets.showcase
            }
        }

        addModdingDependenciesTo sourceSets.test
        addModdingDependenciesTo sourceSets.showcase
        addModdingDependenciesTo sourceSets.integrationTest

        // These are isolated JUnit tests, not FML game tests. Bootstrapping a mod layer here
        // loads LWJGL in a second classloader and also forbids direct mixin-package tests.
    }

    repositories {
        maven {
            url = 'https://maven.neoforged.net/releases'
        }
        mavenCentral()
        maven {
            url = 'https://maven.latvian.dev/releases'
            content { includeGroup 'dev.latvian.mods' }
        }
        maven {
            url = 'https://maven.architectury.dev/'
            content { includeGroup 'dev.architectury' }
        }
        maven {
            url = 'https://api.modrinth.com/maven'
            content { includeGroup 'maven.modrinth' }
        }
        exclusiveContent {
            forRepository { mavenCentral() }
            filter {
                includeGroup 'com.github.stephengold'
                includeGroup 'javax.vecmath'
            }
        }
        if (project.hasProperty('rosettaRepo')) {
            maven {
                url = uri(project.property('rosettaRepo'))
                content { includeGroup 'dev.rosetta' }
            }
        }
        if (project.hasProperty('f3TweakerJar')) {
            flatDir { dirs rootProject.file(project.property('f3TweakerJar')).parentFile }
        }
    }

    dependencies {
        // NeoForge runs in official mappings, so plain configurations carry everything and no
        // `mod*` remapping configurations exist.
        for (physicsLibrary in [
                [group: 'com.github.stephengold', name: 'jbullet', version: jbullet_version, range: "[${jbullet_version},1.0.4)"],
                [group: 'com.github.stephengold', name: 'stack-alloc', version: stack_alloc_version, range: "[${stack_alloc_version},1.0.3)"],
                [group: 'javax.vecmath', name: 'vecmath', version: vecmath_version, range: "[${vecmath_version},1.5.3)"]]) {
            jarJar(api("${physicsLibrary.group}:${physicsLibrary.name}:${physicsLibrary.version}") { transitive = false }) {
                version {
                    strictly physicsLibrary.range
                    prefer physicsLibrary.version
                }
            }
            additionalRuntimeClasspath("${physicsLibrary.group}:${physicsLibrary.name}:${physicsLibrary.version}") {
                transitive = false
            }
        }

        jarJar(api("org.lwjgl:lwjgl-assimp:${lwjgl_version}") { transitive = false }) {
            version {
                strictly lwjgl_version_range
                prefer lwjgl_version
            }
        }
        additionalRuntimeClasspath("org.lwjgl:lwjgl-assimp:${lwjgl_version}") { transitive = false }

        for (nativesClassifier in ['windows', 'linux', 'macos', 'windows-arm64', 'linux-arm64', 'macos-arm64']) {
            runtimeOnly "org.lwjgl:lwjgl-assimp:${lwjgl_version}:natives-${nativesClassifier}"
            assimpNatives "org.lwjgl:lwjgl-assimp:${lwjgl_version}:natives-${nativesClassifier}"
            // NeoForge's dev bootstrap builds the game classloader from `legacyClassPath.file`,
            // not from the JVM `-cp`, so the natives need to be on the additional runtime
            // classpath too: `Assimp`'s static initializer resolves
            // `<platform>/<arch>/org/lwjgl/assimp/*.dll` through its own classloader.
            additionalRuntimeClasspath("org.lwjgl:lwjgl-assimp:${lwjgl_version}:natives-${nativesClassifier}") {
                transitive = false
            }
        }

        implementation platform("org.lwjgl:lwjgl-bom:${lwjgl_version}")

        compileOnly("dev.latvian.mods:kubejs-neoforge:${kubejs_version}") { transitive = false }
        compileOnly("dev.latvian.mods:rhino:${rhino_version}") { transitive = false }
        if (project.hasProperty('withKubeJS') || project.hasProperty('clientKubeJsSmoke') ||
                project.hasProperty('clientKubeJsWorldSmoke')) {
            runtimeOnly("dev.latvian.mods:kubejs-neoforge:${kubejs_version}") { transitive = false }
            runtimeOnly("dev.latvian.mods:rhino:${rhino_version}") { transitive = false }
        }

        compileOnly("maven.modrinth:gzevkJbM:${photon_version}") { transitive = false }
        compileOnly("maven.modrinth:B1CBVXHX:${ldlib_version}") { transitive = false }
        if (!project.hasProperty('withoutOptionalMods')) {
            runtimeOnly("maven.modrinth:gzevkJbM:${photon_version}") { transitive = false }
            runtimeOnly("maven.modrinth:B1CBVXHX:${ldlib_version}") { transitive = false }
        }
        // `-PwithoutOculus` drops the whole shader stack (Iris + Sodium) on this node.
        if (!project.hasProperty('withoutOculus')) {
            runtimeOnly("maven.modrinth:iris:${iris_version}") { transitive = false }
            runtimeOnly("maven.modrinth:sodium:${sodium_version}") { transitive = false }
        }
        if (project.hasProperty('rosettaRepo')) {
            runtimeOnly("dev.rosetta:rosetta-remote-debug-bridge-neoforge:${project.findProperty('rosettaVersion') ?: '1.0.0'}") {
                transitive = false
            }
        }
        // Locally built 1.21.1 mod for the dev client. ModDevGradle has no `fg.deobf` and its
        // `modRuntimeOnly` only takes repository notations, so a plain jar goes on the runtime
        // classpath like any other local file dependency. The sibling project is not part of the
        // repository, so only wire it in where it has actually been built; a clean checkout and
        // CI must not depend on a file outside the repo.
        def localF3Tweaker = rootProject.file("../F3Tweaker/build/libs/F3Tweaker-1.21.1-1.0.0.jar")
        if (localF3Tweaker.isFile()) {
            runtimeOnly(files(localF3Tweaker))
        }

        // Minecraft/Forge supply JNA at runtime; compile-only keeps it out of the jar.
        compileOnly "net.java.dev.jna:jna:${jna_version}"
        testImplementation "net.java.dev.jna:jna:${jna_version}"

        testImplementation platform("org.junit:junit-bom:${junit_version}")
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    tasks.named('processResources', ProcessResources).configure {
        inputs.properties metadata
        filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) { expand metadata }
    }
    tasks.named('processShowcaseResources', ProcessResources).configure {
        inputs.properties metadata
        filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) { expand metadata }
    }

    tasks.named('jar', Jar).configure {
        archiveClassifier = mod_loader
        manifest {
            attributes('Specification-Title': mod_name, 'Specification-Vendor': mod_authors,
                    'Specification-Version': '1',
                    'Implementation-Title': "${rootProject.name}-${sc.current.version}",
                    'Implementation-Version': project.version, 'Implementation-Vendor': mod_authors,
                    'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"))
        }
        from([rootProject.file('LICENSE'), rootProject.file('docs/THIRD_PARTY_NOTICES.md')]) { into 'META-INF' }
        from(rootProject.file('licenses')) { into 'META-INF/licenses' }
        from(rootProject.file('third_party_sources')) { into 'META-INF/third-party-sources' }
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        from({
            project.configurations.assimpNatives.collect {
                zipTree(it).matching {
                    exclude 'META-INF/**'
                    exclude '**/*.git'
                    exclude '**/*.sha1'
                }
            }
        })
    }
}

// Process test sources with the same target rules as production sources.
stonecutter.tasks.configureSource(sourceSets.test)
stonecutter.tasks.configureSource(sourceSets.showcase)
stonecutter.tasks.configureSource(sourceSets.integrationTest)

// ---------------------------------------------------------------- shared by both nodes

// Native pipeline. Default builds NEVER compile C++: they package the prebuilt natives that are
// committed under src/main/resources/native/... . Passing -PbuildNative opts in to re-building
// them from the manifest; a missing toolchain or a failed script fails the build loudly.
if (project.hasProperty('buildNative')) {
    def windows = org.gradle.internal.os.OperatingSystem.current().isWindows()
    def nativeScript = windows ? 'tools/native/build_native.bat' : 'tools/native/build_native.sh'
    def expectedNatives = [
            'native/fabrik/windows-x86/fabrik.dll',
            'native/fabrik/windows-x86_64/fabrik.dll',
            'native/fabrik/windows-aarch64/fabrik.dll',
            'native/fabrik/linux-armv7/libfabrik.so',
            'native/fabrik/linux-x86_64/libfabrik.so',
            'native/fabrik/linux-aarch64/libfabrik.so',
            'native/fabrik/macos-x86_64/libfabrik.dylib',
            'native/fabrik/macos-aarch64/libfabrik.dylib',
    ]

    def buildNative = tasks.register('buildNative', Exec) {
        group = 'native'
        description = 'Rebuilds and copies native libraries via the tools/native manifest (-PbuildNative).'
        workingDir = rootProject.projectDir
        if (windows) {
            // cmd splits on '/', so pass a backslash absolute path through `call`.
            commandLine 'cmd', '/c', 'call', rootProject.file(nativeScript).absolutePath
        } else {
            commandLine 'bash', rootProject.file(nativeScript).absolutePath
        }
        ignoreExitValue = true
        doFirst { logger.lifecycle("Building native libraries with ${nativeScript}") }
        doLast {
            def result = executionResult.get()
            if (result.exitValue != 0) {
                throw new GradleException("Native build script '${nativeScript}' failed (exit ${result.exitValue}). " +
                        'Configure the native toolchain manually (FabriKNative needs Zig; see its download_zig.bat) ' +
                        'and rerun with -PbuildNative, or drop -PbuildNative to use the committed prebuilt natives.')
            }
            def missing = expectedNatives.findAll { !rootProject.file("src/main/resources/${it}").isFile() }
            if (!missing.isEmpty()) {
                throw new GradleException("Native build finished but did not produce: ${missing.join(', ')}. " +
                        'Configure the native toolchain manually and rerun with -PbuildNative.')
            }
        }
    }
    tasks.named('processResources') { dependsOn buildNative }
    tasks.named('jar') { dependsOn buildNative }
}

// The AssimpShowcase companion mod. It is a separate mod, not part of the engine jar.
def showcaseJar = tasks.register('showcaseJar', Jar) {
    group = 'build'
    description = 'Builds the AssimpShowcase companion mod jar.'
    archiveBaseName = "assimpshowcase-${minecraft_version}"
    archiveVersion = mod_version
    archiveClassifier = mod_loader
    from sourceSets.showcase.output
    from(rootProject.file('LICENSE')) { into 'META-INF' }
    manifest { attributes 'MixinConfigs': 'mixins.assimpshowcase.json' }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// LegacyForge only remaps the main `jar` automatically. The companion mod is embedded in no
// other artifact, but it is shipped, so its vanilla calls must be SRG-named for the production
// runtime. NeoForge runs mojmap, so no remap is needed there.
if (isForge) {
    configurations.create('showcaseRuntimeElements') {
        extendsFrom configurations.showcaseRuntimeClasspath
    }
    configurations.create('showcaseApiElements') {
        extendsFrom configurations.showcaseCompileClasspath
    }
    // Local variable, not `ext.*`: inside `showcaseJar.configure { }` the name `ext` resolves to
    // the task's own extra-properties container, which is empty.
    def showcaseReobf = obfuscation.reobfuscate(showcaseJar, sourceSets.showcase)
    showcaseJar.configure { finalizedBy showcaseReobf }
}

sourceSets.test.compileClasspath += sourceSets.showcase.output
sourceSets.test.runtimeClasspath += sourceSets.showcase.output

