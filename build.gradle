buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '6.0.54'
        classpath 'org.spongepowered:mixingradle:0.7.38'
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'org.spongepowered.mixin'

version = mod_version
group = maven_group
base { archivesName = archives_base_name }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', 'assimploader'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            lazyToken('minecraft_classpath') {
                configurations.library.copyRecursive().resolve().collect { it.absolutePath }.join(File.pathSeparator)
            }

            mods {
                assimploader {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', 'assimploader'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            lazyToken('minecraft_classpath') {
                configurations.library.copyRecursive().resolve().collect { it.absolutePath }.join(File.pathSeparator)
            }

            mods {
                assimploader {
                    source sourceSets.main
                }
            }
        }

        data {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            args '--all', '--mod', 'assimploader', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')

            lazyToken('minecraft_classpath') {
                configurations.library.copyRecursive().resolve().collect { it.absolutePath }.join(File.pathSeparator)
            }

            mods {
                assimploader {
                    source sourceSets.main
                }
            }
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
    library
    implementation.extendsFrom library
}

repositories {
    maven { url = 'https://maven.minecraftforge.net/' }
    mavenCentral()
    // ModernUI
    maven { url = 'https://maven.izzel.io/releases/' }
    // glsl-transformer (optional Iris/Oculus shader injection)
    maven { url = 'https://jitpack.io' }
}

dependencies {
    minecraft "net.minecraftforge:forge:1.20.1-${forge_version}"

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // LWJGL Assimp bindings - MUST match Minecraft's LWJGL version (3.3.1)
    implementation(platform("org.lwjgl:lwjgl-bom:3.3.1"))
    implementation "org.lwjgl:lwjgl-assimp:3.3.1"

    // Bundle LWJGL Assimp into the mod
    jarJar(group: 'org.lwjgl', name: 'lwjgl-assimp', version: '[3.3.1,3.3.2)')

    // Natives are packaged into the jar by the `jar` task below; they must never be on the
    // compile classpath and must never leak into other mods' classpath.
    runtimeOnly "org.lwjgl:lwjgl-assimp:3.3.1:natives-windows"
    runtimeOnly "org.lwjgl:lwjgl-assimp:3.3.1:natives-linux"
    runtimeOnly "org.lwjgl:lwjgl-assimp:3.3.1:natives-macos"

    // ModernUI - hard runtime dependency, served from its own maven.
    implementation fg.deobf("icyllis.modernui:ModernUI-Forge:${modernui_forge_version}")
    implementation fg.deobf("icyllis.modernui:ModernUI-Core:${modernui_core_version}")

    // Photon + LDLib are compile-time only (the integration is optional at runtime) and are
    // NOT redistributable, so they are fetched into mods_dev/ by downloadDevDeps instead of
    // being committed. Run `./gradlew downloadDevDeps` on a fresh clone.
    def softDeps = fileTree(dir: 'mods_dev', include: [
            'photon-*.jar',
            'ldlib-*.jar'
    ])
    if (softDeps.isEmpty()) {
        // Not fatal at configuration time: `downloadDevDeps` has to be able to run first,
        // and compileJava depends on it.
        logger.warn("mods_dev/ has no photon/ldlib jars yet - run ./gradlew downloadDevDeps")
    }
    compileOnly softDeps
    runtimeOnly softDeps

    // glsl-transformer (AGPLv3) - optional, only used when Iris/Oculus is present
    compileOnly 'io.github.douira:glsl-transformer:2.0.0-pre13'
    compileOnly 'org.antlr:antlr4-runtime:4.13.1'

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.9.3'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.9.3'
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : "assimploader",
                "Specification-Vendor"    : "MineRealms Team",
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : "MineRealms Team",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                "MixinConfigs"            : "mixins.photon_compat.json,mixins.iris_compat.json"
        ])
    }

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

jarJar.enable()

// The '-all' jar is what users install, so the Assimp natives have to live there.
// (Putting them in the plain jar only would ship a mod that cannot load its native library.)
tasks.named('jarJar').configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from {
        project.configurations.runtimeClasspath.findAll {
            it.name.contains('lwjgl-assimp') && it.name.contains('natives')
        }.collect {
            zipTree(it).matching {
                exclude 'META-INF/**'
                exclude '**/*.git'
                exclude '**/*.sha1'
            }
        }
    }
}

mixin {
    add sourceSets.main, "assimploader.refmap.json"
    config "mixins.photon_compat.json"
    config "mixins.iris_compat.json"
}

jar.finalizedBy('reobfJar')

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

tasks.withType(Test) {
    useJUnitPlatform()
}

// ==================== Deployment ====================

/**
 * Copy the built jar into a game's mods folder.
 * The destination is machine-local: pass -PgameModsDir=... instead of hardcoding it.
 */
tasks.register('copyToGameMods', Copy) {
    description = 'Copy built JAR to a game mods directory (requires -PgameModsDir=...)'
    group = 'deployment'

    def dest = project.findProperty('gameModsDir')
    onlyIf { dest != null }

    from("${buildDir}/libs") {
        include '*-all.jar'
        rename '(.*)-all.jar', '$1.jar'
    }
    if (dest != null) {
        into dest
    }

    dependsOn 'reobfJarJar'

    doLast {
        println "Copied jar to ${dest}"
    }
}


// ==================== Optional dev-only dependencies ====================

/**
 * Photon and LDLib are needed to compile the optional Photon editor integration, but they
 * are not redistributable, so they are downloaded on demand instead of being committed.
 *
 * Pinned by Modrinth version id (not version number) so the artefacts can never silently
 * change underneath us, and verified by sha512.
 */
def devOnlyDeps = [
        [
                name  : 'photon-forge-1.20.1-1.1.17.jar',
                url   : 'https://cdn.modrinth.com/data/gzevkJbM/versions/a7chTVuf/photon-forge-1.20.1-1.1.17.jar',
                sha512: 'b0bdc63d73f9eda4a38c16e2cedbf80e325f57ba4452fbab8959a8bbc9f3a99754298d8b45376aee69e87ad91508c63ad045d76233b304a6a1de9cbeaf02c8f6'
        ],
        [
                name  : 'ldlib-forge-1.20.1-1.0.48.jar',
                url   : 'https://cdn.modrinth.com/data/B1CBVXHX/versions/yhlCY3k1/ldlib-forge-1.20.1-1.0.48.jar',
                sha512: '564f71dccc84854e84fc795d7c2972b785498de198bafdae22e46e7b6fd257e6b4cd0b24396eae7caaec16f090500069f06e6b43ad50130a9d50ee9923850c59'
        ]
]

tasks.named('compileJava').configure {
    dependsOn 'downloadDevDeps'
}

tasks.register('downloadDevDeps') {
    group = 'deployment'
    description = 'Downloads the non-redistributable dev-only mod jars into mods_dev/'

    def targetDir = layout.projectDirectory.dir('mods_dev').asFile
    outputs.dir(targetDir)

    doLast {
        def sha512 = { File file ->
            def digest = java.security.MessageDigest.getInstance('SHA-512')
            file.withInputStream { input ->
                byte[] buffer = new byte[64 * 1024]
                int read
                while ((read = input.read(buffer)) != -1) {
                    digest.update(buffer, 0, read)
                }
            }
            digest.digest().collect { String.format('%02x', it) }.join()
        }

        targetDir.mkdirs()

        devOnlyDeps.each { dep ->
            def target = new File(targetDir, dep.name)

            if (target.isFile() && sha512(target) == dep.sha512) {
                logger.lifecycle("Already present: ${dep.name}")
                return
            }

            logger.lifecycle("Downloading ${dep.name} ...")
            def connection = new URL(dep.url).openConnection()
            connection.setRequestProperty('User-Agent', 'assimploader-build')
            connection.connectTimeout = 30_000
            connection.readTimeout = 120_000

            def temp = new File(targetDir, dep.name + '.part')
            connection.inputStream.withStream { input ->
                temp.withOutputStream { output -> output << input }
            }

            def actual = sha512(temp)
            if (actual != dep.sha512) {
                temp.delete()
                throw new GradleException("Checksum mismatch for ${dep.name}: expected ${dep.sha512}, got ${actual}")
            }

            if (target.exists() && !target.delete()) {
                throw new GradleException("Could not replace ${target}")
            }
            if (!temp.renameTo(target)) {
                throw new GradleException("Could not move ${temp} to ${target}")
            }
            logger.lifecycle("Downloaded ${dep.name}")
        }
    }
}
