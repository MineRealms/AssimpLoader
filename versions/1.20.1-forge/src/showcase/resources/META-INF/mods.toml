modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="assimpshowcase"
version="${mod_version}"
displayName="AssimpShowcase"
authors="${mod_authors}"
description='''Optional AssimpLoader exhibits, deer, vehicles and rocket exhaust examples.'''

[[dependencies.assimpshowcase]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.assimpshowcase]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.assimpshowcase]]
modId="assimploader"
mandatory=true
versionRange="[0,)"
ordering="AFTER"
side="BOTH"

[[dependencies.assimpshowcase]]
modId="kubejs"
mandatory=false
versionRange="${kubejs_version_range}"
ordering="AFTER"
side="BOTH"
