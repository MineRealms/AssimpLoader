modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/MineRealms/AssimpLoader/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="icon.png"
authors="${mod_authors}"
displayTest="IGNORE_ALL_VERSION"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="kubejs"
type="optional"
versionRange="${kubejs_version_range}"
ordering="AFTER"
side="BOTH"

# NeoForge registers mixins through the mods.toml; unlike Forge 1.20.1 there is no
# MixinConfigs manifest attribute.
[[mixins]]
config="mixins.photon_compat.json"

[[mixins]]
config="mixins.iris_compat.json"

[[mixins]]
config="mixins.assimploader.json"
