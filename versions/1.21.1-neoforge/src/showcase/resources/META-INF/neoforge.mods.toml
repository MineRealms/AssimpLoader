modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="assimpshowcase"
version="${mod_version}"
displayName="AssimpShowcase"
authors="${mod_authors}"
description='''Optional AssimpLoader exhibits, deer, vehicles and rocket exhaust examples.'''

[[dependencies.assimpshowcase]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.assimpshowcase]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.assimpshowcase]]
modId="assimploader"
type="required"
versionRange="[0,)"
ordering="AFTER"
side="BOTH"

[[dependencies.assimpshowcase]]
modId="kubejs"
type="optional"
versionRange="${kubejs_version_range}"
ordering="AFTER"
side="BOTH"

[[mixins]]
config="mixins.assimpshowcase.json"
