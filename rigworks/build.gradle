apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'org.spongepowered.mixin'

version = rootProject.version
group = 'cn.minerealms.rigworks'
base { archivesName = 'rigworks' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
sourceSets {
    integration {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

repositories {
    maven { url = 'https://maven.minecraftforge.net/' }
    mavenCentral()
    maven { url = 'https://maven.latvian.dev/releases' }
    maven { url = 'https://maven.architectury.dev/' }
}

minecraft { mappings channel: 'official', version: '1.20.1' }
// Development consumers must not select the JAR rewritten in-place by reobfJar.
// In particular ForgeGradle collects this project's runtime dependencies for root runs.
for (configurationName in ['runtimeClasspath', 'integrationRuntimeClasspath', 'testRuntimeClasspath']) {
    configurations.named(configurationName).configure {
        attributes.attribute(LibraryElements.LIBRARY_ELEMENTS_ATTRIBUTE,
                objects.named(LibraryElements, LibraryElements.CLASSES))
    }
}
dependencies {
    minecraft "net.minecraftforge:forge:1.20.1-${rootProject.forge_version}"
    implementation project(':')
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    for (coordinate in ['dev.latvian.mods:kubejs-forge:2001.6.5-build.26',
                        'dev.latvian.mods:rhino-forge:2001.2.2-build.17',
                        'dev.architectury:architectury-forge:9.1.12']) {
        compileOnly(fg.deobf(coordinate)) { transitive = false }
    }
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.9.3'
    testImplementation(fg.deobf('dev.latvian.mods:rhino-forge:2001.2.2-build.17')) { transitive = false }
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.9.3'
}
mixin {
    add sourceSets.main, 'rigworks.refmap.json'
    config 'mixins.rigworks.json'
    config 'mixins.rigworks.kubejs.json'
}
jar {
    manifest { attributes 'MixinConfigs': 'mixins.rigworks.json,mixins.rigworks.kubejs.json' }
}
jar.finalizedBy 'reobfJar'
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.withType(Test).configureEach { useJUnitPlatform() }
