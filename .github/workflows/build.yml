name: Build

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Photon and LDLib are needed to compile the optional Photon integration but must not
      # be redistributed through the repository. downloadDevDeps pins them by Modrinth
      # version id and verifies a sha512 checksum.
      - name: Download dev-only dependencies
        run: ./gradlew downloadDevDeps --stacktrace --no-daemon

      - name: Build
        run: |
          set -o pipefail
          # --no-daemon: ForgeGradle keeps project-scoped state in statics and breaks with
          # "Project services has been closed" when a daemon is reused; a fresh JVM avoids it.
          ./gradlew build --stacktrace --console=plain --no-daemon 2>&1 | tee gradle-build.log

      # GitHub only lets anonymous users read check-run *annotations*, not the raw log,
      # so failed builds re-emit the interesting part of the log as annotations.
      - name: Surface the failure
        if: failure()
        run: |
          emit() {
            sed 's/%/%25/g; s/\r//g' | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::$line"
            done
          }
          if [ -f gradle-build.log ]; then
            echo "log lines: $(wc -l < gradle-build.log)"
            # The actionable part of a Gradle failure: the headline plus the
            # "What went wrong" section (the stack trace alone is noise).
            grep -a -E "^(FAILURE:|\* What went wrong|\* Try:|BUILD FAILED)" -A 30 gradle-build.log \
              | head -60 | emit
            echo "--- last 15 lines ---"
            tail -15 gradle-build.log | emit
          else
            echo "::error::gradle-build.log was not produced"
          fi

      # TEMPORARY diagnostic: anonymous users cannot read job logs, only check-run
      # annotations, so the whole log is re-emitted in 30-line chunks.
      - name: Dump full log as annotations
        if: failure()
        run: |
          [ -f gradle-build.log ] || exit 0
          split -l 30 -d -a 3 gradle-build.log chunk_
          for f in chunk_*; do
            MSG=$(tr '\n' '\001' < "$f" | sed 's/%/%25/g; s/\001/%0A/g; s/\r//g')
            echo "::error title=$f::$MSG"
          done | head -40

      # Regression guard: the distributable jar must contain the Assimp natives, otherwise
      # the mod loads but cannot import a single model.
      - name: Verify the distributable jar
        run: |
          set -e
          JAR=$(ls build/libs/*-all.jar)
          echo "Checking $JAR"
          for entry in windows/x64/org/lwjgl/assimp/assimp.dll \
                       linux/x64/org/lwjgl/assimp/libassimp.so \
                       macos/x64/org/lwjgl/assimp/libassimp.dylib \
                       META-INF/mods.toml \
                       mixins.photon_compat.json; do
            unzip -l "$JAR" | grep -q "$entry" || { echo "missing $entry"; exit 1; }
          done
          echo "OK"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: assimploader-build
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            build/reports/tests/test
            build/test-results/test
          if-no-files-found: ignore
