name: Build

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 1.20.1-forge
            # Gradle itself must run on 21: the Stonecutter 0.9.8 settings plugin refuses to
            # resolve on an older JVM. The 1.20.1 compile target still comes from the per-node
            # java_version toolchain in versions/<node>/gradle.properties.
            java: '21'
            metadata: META-INF/mods.toml
            pack-format: 15
          - node: 1.21.1-neoforge
            java: '21'
            metadata: META-INF/neoforge.mods.toml
            pack-format: 34
    env:
      BUILD_NODE: ${{ matrix.node }}
      MOD_METADATA: ${{ matrix.metadata }}
      PACK_FORMAT: ${{ matrix.pack-format }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Photon and LDLib are needed to compile the optional Photon integration but must not
      # be redistributed through the repository. downloadDevDeps pins them by Modrinth
      # version id and verifies a sha512 checksum. Only the Forge node needs them today.
      - name: Download dev-only dependencies
        if: matrix.node == '1.20.1-forge'
        run: ./gradlew :1.20.1-forge:downloadDevDeps --stacktrace --no-daemon

      - name: Build and test the node
        run: |
          set -o pipefail
          ./gradlew ":${BUILD_NODE}:build" --stacktrace --console=plain --no-daemon 2>&1 | tee gradle-build.log

      # GitHub only lets anonymous users read check-run *annotations*, not the raw log,
      # so failed builds re-emit the interesting part of the log as annotations.
      - name: Surface the failure
        if: failure()
        run: |
          emit() {
            sed 's/%/%25/g; s/\r//g' | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::$line"
            done
          }
          if [ -f gradle-build.log ]; then
            echo "log lines: $(wc -l < gradle-build.log)"
            # The actionable part of a Gradle failure: the headline plus the
            # "What went wrong" section (the stack trace alone is noise).
            grep -a -E "^(FAILURE:|\* What went wrong|\* Try:|BUILD FAILED)" -A 30 gradle-build.log \
              | head -60 | emit
            echo "--- last 15 lines ---"
            tail -15 gradle-build.log | emit
          else
            echo "::error::gradle-build.log was not produced"
          fi

      - name: Verify engine and Showcase release jars
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import tomllib
          from zipfile import ZipFile

          node = os.environ['BUILD_NODE']
          metadata = os.environ['MOD_METADATA']
          pack_format = int(os.environ['PACK_FORMAT'])
          libs = Path('versions') / node / 'build' / 'libs'
          # Release jars are named <mod>-<minecraft>-<version>-<loader>.jar (see da77d07), so
          # the node name alone is not enough to match them.
          minecraft, _, loader = node.rpartition('-')
          natives = {
              f'{platform}/{arch}/org/lwjgl/assimp/{library}'
              for platform, library in (
                  ('windows', 'assimp.dll'),
                  ('linux', 'libassimp.so'),
                  ('macos', 'libassimp.dylib'),
              )
              for arch in ('x64', 'arm64')
          }
          for mod_id in ('assimploader', 'assimpshowcase'):
              jars = [p for p in libs.glob(f'{mod_id}-{minecraft}-*-{loader}.jar')
                      if not p.stem.endswith(('-sources', '-javadoc'))]
              if len(jars) != 1:
                  raise SystemExit(f'Expected one {mod_id} release jar, found {jars}')
              with ZipFile(jars[0]) as jar:
                  names = set(jar.namelist())
                  required = {metadata, 'pack.mcmeta'}
                  if mod_id == 'assimploader':
                      required |= natives | {'META-INF/jarjar/metadata.json',
                                            'mixins.assimploader.json',
                                            'mixins.iris_compat.json',
                                            'mixins.photon_compat.json'}
                  else:
                      required.add('mixins.assimpshowcase.json')
                  missing = required - names
                  if missing:
                      raise SystemExit(f'{jars[0]} missing {sorted(missing)}')
                  mods = tomllib.loads(jar.read(metadata).decode('utf-8'))['mods']
                  if [m['modId'] for m in mods] != [mod_id]:
                      raise SystemExit(f'{jars[0]} has wrong mod declarations: {mods}')
                  actual_format = json.loads(jar.read('pack.mcmeta'))['pack']['pack_format']
                  if actual_format != pack_format:
                      raise SystemExit(f'{jars[0]} has pack_format {actual_format}, expected {pack_format}')
                  if any(n.startswith('cn/minerealms/rigworks/') or n.endswith('SmokeTest.class')
                         for n in names):
                      raise SystemExit(f'{jars[0]} contains consumer or integration-test classes')
                  if node.endswith('-forge') and mod_id + '.refmap.json' not in names:
                      raise SystemExit(f'{jars[0]} has no Forge mixin refmap')
              print(f'Verified {jars[0]}')
          PY

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: assimploader-${{ matrix.node }}
          path: versions/${{ matrix.node }}/build/libs/*.jar
          if-no-files-found: error

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.node }}
          path: |
            versions/${{ matrix.node }}/build/reports/tests/test
            versions/${{ matrix.node }}/build/test-results/test
          if-no-files-found: ignore

  # The Checks tab is out of sight for most reviewers, so fold the matrix result into a
  # single pull request comment. The comment carries a marker and is updated in place on
  # every push instead of stacking up a new one per run.
  report:
    name: PR report
    needs: build
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      checks: read
      pull-requests: write
    steps:
      - name: Post the check summary on the pull request
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- assimploader-build-report -->';
            const pr = context.payload.pull_request;
            const sha = pr.head.sha;
            const { data: ref } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: sha,
              filter: 'latest',
            });
            const icon = {
              success: '✅', failure: '❌', cancelled: '🚫', skipped: '⏭️',
              timed_out: '⌛', stale: '🧹', action_required: '🔒',
            };
            const runs = ref.check_runs.filter(run => run.name !== 'PR report');
            const rows = runs.map(run =>
              `| ${icon[run.conclusion] || '⏳'} | ${run.name} | ${run.conclusion || 'in progress'} |`);
            const failed = runs.filter(run => run.conclusion === 'failure').length;
            let verdict;
            if (rows.length === 0) {
              verdict = '还没有读到任何 check run（工作流可能刚启动），这条评论稍后会被更新。';
            } else if (failed > 0) {
              verdict = `**${failed} 个任务失败。** 点上面的“完整运行”看日志；失败节点同时会把 Gradle 的失败摘要写成 check 注解。`;
            } else {
              verdict = '全部通过。合并前仍需在真实客户端里验证：编译和测试通过不等于游戏内可用。';
            }
            const body = [
              marker,
              `### 构建检查 · PR #${pr.number}`,
              '',
              `HEAD \`${sha.slice(0, 7)}\` · [完整运行](${context.payload.repository.html_url}/actions/runs/${context.runId})`,
              '',
              '| 结果 | 任务 | 结论 |',
              '| --- | --- | --- |',
              ...rows,
              '',
              verdict,
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              per_page: 100,
            });
            const existing = comments.find(comment => comment.body && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body,
              });
            }
