org.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# Stonecutter's Groovy support is intentional here; silence its "limited support" notice.
dev.kikugie.stonecutter.hard_mode=true

# Shared mod metadata. Node-specific versions live in versions/<node>/gradle.properties.
mod_id=assimploader
mod_name=AssimpLoader - Advanced 3D Model System
mod_license=MIT
mod_authors=MineRealms Team
mod_description=Advanced 3D model loading system bridging Assimp and Minecraft's rendering pipeline.
mod_version=1.0.0
maven_group=cn.minerealms
archives_base_name=assimploader

junit_version=5.9.3
# Minecraft/Forge already ship JNA on the game classpath, so it is compileOnly for the mod;
# tests need it explicitly. 5.14.0 is the version used by the supported Minecraft nodes.
jna_version=5.14.0
